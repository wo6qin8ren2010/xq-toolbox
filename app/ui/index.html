            }
            const isCurrentlyVisible = widget.style.opacity === '1';
            if (!autoPopupDl && !isCurrentlyVisible) return;
            if (userDismissedWidget && !isCurrentlyVisible) return;
            widget.style.opacity = '1';
            widget.style.transform = 'translateY(0)';
            widget.style.pointerEvents = 'auto';
            const activeRouteLabels = Array.from(new Set(active.map(dl => getDownloadRouteDetails(dl).compact)));
            const routeSummary = activeRouteLabels.length === 1
                ? activeRouteLabels[0]
                : uiText(`${activeRouteLabels.length} 条任务线路`, `${activeRouteLabels.length} task routes`);
            const activeSpeed = active
                .filter(dl => dl.status === 'downloading' && !isDownloadMerging(dl))
                .reduce((sum, dl) => sum + Math.max(0, sanitizeNumber(dl.speed, 0)), 0);
            widget.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid rgba(0,0,0,0.05); padding-bottom:6px;">
                <span style="font-size:12px; color:var(--color-text-secondary); font-weight:600;">${widgetText.title}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:11px; color:#888;">${widgetText.silent}</span>
                    <label class="toggle-switch" style="transform: scale(0.65); margin: 0; transform-origin: right center;">
                        <input type="checkbox" ${!autoPopupDl ? 'checked' : ''} onchange="onAutoPopupChange(!this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                    <button class="close-btn" onclick="userDismissedWidget=true; document.getElementById('downloadWidget').style.opacity='0'; document.getElementById('downloadWidget').style.transform='translateY(10px)'; document.getElementById('downloadWidget').style.pointerEvents='none';">
                        <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div class="dl-widget-summary">
                <span>${escapeHtml(routeSummary)}</span>
                <span>${escapeHtml(uiText('总速 ', 'Total ') + formatDownloadSpeedValue(activeSpeed))}</span>
            </div>`;
            active.slice(0, 3).forEach(dl => {
                const info = getDownloadDisplayInfo(dl);
                const isPaused = info.isPaused;
                const percentText = sanitizeMB(dl.total) > 0 ? info.percentText : widgetText.connecting;
                const progressText = sanitizeMB(dl.total) > 0 ? info.progressText : widgetText.waiting;
                const titleColor = isPaused ? 'color: var(--color-text-secondary);' : '';
                const barColor = `background-color: ${isPaused ? '#999' : info.statusColor};`;
                const speedClass = info.speedAnomaly ? ' anomaly' : '';
                const speedText = info.speedAnomaly
                    ? `<span class="dl-status-pill${speedClass}">${escapeHtml(info.speedLabel)}</span>`
                    : escapeHtml(info.speedLabel);
                const etaText = info.etaText ? ` &nbsp;&nbsp;${escapeHtml(info.etaText)}` : '';
                const hintHtml = info.hintText ? `<div class="dl-widget-task-hint">${escapeHtml(info.hintText)}</div>` : '';
                widget.innerHTML += `
                    <div style="margin-bottom: 8px; cursor: pointer;" data-download-id="${escapeHtml(dl.id)}">
                        <div class="dl-title" style="${titleColor}"><span>${escapeHtml(dl.name)}</span><span>${percentText}</span></div>
                        <div class="dl-bar-bg"><div class="dl-bar-fill" style="width: ${info.percent}%; ${barColor}"></div></div>
                        <div class="dl-stats"><span>${speedText}${etaText}</span><span>${progressText}</span></div>
                        ${hintHtml}
                    </div>
                `;
            });
            if (active.length > 3) {
                widget.innerHTML += `<div style="text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:4px;">${widgetText.more(active.length - 3)}</div>`;
            }
            widget.querySelectorAll('[data-download-id]').forEach(el => {
                el.addEventListener('click', () => toggleDownloadState(el.dataset.downloadId));
            });
        }
        function renderDownloadsPage() {
            const container = document.getElementById('downloadsPageContainer');
            if (!container || !database[currentViewIndex] || database[currentViewIndex].type !== 'downloads_page') {
                return;
            }
            // Trigger dynamic existence validation for all 'completed' files whenever the page is rendered
            downloads.filter(d => d.status === 'completed').forEach(dl => {
                sendMessageToCpp('check_file_exists|' + dl.id + '|' + dl.savePath);
            });
            if (downloads.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 60px; color: var(--color-text-secondary); font-size: 15px;">${getLangValue('sNoHistory')}</div>`;
                return;
            }
            let html = '<div class="dl-hist-list">';
            downloads.forEach(dl => {
                const info = getDownloadDisplayInfo(dl);
                const routeInfo = getDownloadRouteDetails(dl);
                const cardClasses = ['dl-hist-card'];
                if (info.speedAnomaly) cardClasses.push('dl-card-speed-anomaly');
                const isSwitchingRoute = !!dl._pendingRouteSwitch || dl.phase === 'switching_route';
                const headerStatusText = (info.isDone || info.isCheckingSize || info.isQueued || info.isPaused || info.isErr || info.isMerging || isSwitchingRoute)
                    ? info.statusText
                    : info.percentText;

                let actionTitle = '';
                let actionIcon = '';
                if (info.isCheckingSize || info.isQueued || (!info.isDone && !info.isPaused && !info.isErr && !info.isMerging)) {
                    actionTitle = getLangValue('sClickPause');
                    actionIcon = '<svg viewBox="0 0 24 24"><line x1="8" y1="5" x2="8" y2="19"></line><line x1="16" y1="5" x2="16" y2="19"></line></svg>';
                } else if (info.isPaused) {
                    actionTitle = getLangValue('sClickResume');
                    actionIcon = '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;"><polygon points="7 4 19 12 7 20 7 4"></polygon></svg>';
                } else if (info.isErr) {
                    actionTitle = uiText('重试下载', 'Retry download');
                    actionIcon = '<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"></path></svg>';
                }
                const actionButtonHtml = actionIcon
                    ? `<button type="button" class="dl-download-action" data-download-action-id="${escapeHtml(dl.id)}" title="${escapeHtml(isSwitchingRoute ? uiText('正在切换线路', 'Switching route') : actionTitle)}" aria-label="${escapeHtml(actionTitle)}" ${isSwitchingRoute ? 'disabled' : ''}>${actionIcon}</button>`
                    : '';

                const metrics = [`<span class="dl-hist-metric">${escapeHtml(info.progressText)}</span>`];
                if (!info.isDone && !info.isCheckingSize && !info.isQueued && !info.isPaused && !info.isErr && !info.isMerging) {
                    const speedClass = info.speedAnomaly ? ' anomaly' : '';
                    const speedHtml = info.speedAnomaly
                        ? `<span class="dl-status-pill${speedClass}">${escapeHtml(info.speedLabel)}</span>`
                        : escapeHtml(info.speedLabel);
                    metrics.push(`<span class="dl-hist-metric">${speedHtml}</span>`);
                    if (info.etaText) metrics.push(`<span class="dl-hist-metric">${escapeHtml(info.etaText)}</span>`);
                }

                const canShowRouteRetry = (!info.isDone && !info.isMerging && dl.url && /yu\.vst15\.cn/i.test(dl.url) && dl.routeSource !== 'lenovo_store');
                const routeExpanded = canShowRouteRetry && expandedDownloadRouteIds.has(dl.id);
                const routeToggleText = isSwitchingRoute
                    ? uiText('切换中', 'Switching')
                    : (routeExpanded ? uiText('收起', 'Hide') : uiText('切换线路', 'Switch route'));
                const routeControlHtml = dl.url
                    ? `<div class="dl-route-control">
                            <span class="dl-route-chip">${escapeHtml(routeInfo.compact)}</span>
                            ${canShowRouteRetry ? `<button type="button" class="dl-route-toggle-btn" data-route-toggle-id="${escapeHtml(dl.id)}" ${isSwitchingRoute ? 'disabled' : ''}>${escapeHtml(routeToggleText)}</button>` : ''}
                       </div>`
                    : '';
                const routeFooterHtml = routeControlHtml ? `<div class="dl-hist-footer">${routeControlHtml}</div>` : '';
                const routeActionsHtml = routeExpanded
                    ? `<div class="dl-route-actions">
                            <button type="button" class="dl-route-action-btn" data-route-retry-id="${escapeHtml(dl.id)}" data-route="telecom" ${isSwitchingRoute ? 'disabled' : ''}>${escapeHtml(uiText('电信重试', 'Telecom retry'))}</button>
                            <button type="button" class="dl-route-action-btn" data-route-retry-id="${escapeHtml(dl.id)}" data-route="mobile" ${isSwitchingRoute ? 'disabled' : ''}>${escapeHtml(uiText('移动重试', 'Mobile retry'))}</button>
                       </div>`
                    : '';
                const hintHtml = info.hintText ? `<div class="dl-widget-task-hint">${escapeHtml(info.hintText)}</div>` : '';
                html += `
                    <div class="${cardClasses.join(' ')}">
                        <div class="dl-hist-header">
                            <div class="dl-hist-name">${escapeHtml(dl.name)}</div>
                            <div class="dl-hist-header-actions">
                                <div class="dl-hist-status" style="color: ${info.textColor}">${escapeHtml(headerStatusText)}</div>
                                ${actionButtonHtml}
                            </div>
                        </div>
                        <div class="dl-bar-bg" style="margin-top:4px; margin-bottom:8px;">
                            <div class="dl-bar-fill" style="width: ${info.percent}%; background-color: ${info.statusColor};"></div>
                        </div>
                        <div class="dl-hist-metrics">${metrics.join('')}</div>
                        ${routeFooterHtml}
                        ${routeActionsHtml}
                        ${hintHtml}
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
            container.querySelectorAll('[data-download-action-id]').forEach(btn => {
                btn.addEventListener('click', () => toggleDownloadState(btn.dataset.downloadActionId));
            });
            container.querySelectorAll('[data-route-toggle-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.routeToggleId;
                    if (expandedDownloadRouteIds.has(id)) expandedDownloadRouteIds.delete(id);
                    else expandedDownloadRouteIds.add(id);
                    renderDownloadsPage();
                });
            });
            container.querySelectorAll('[data-route-retry-id]').forEach(btn => {
                btn.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    retryDownloadWithRoute(btn.dataset.routeRetryId, btn.dataset.route);
                });
            });
        }

</script>
    <script>
function toggleLanguage() {
            const wrap = document.getElementById('langSwitchBtn');
            if (currentLang === 'zh') {
                currentLang = 'en';
                if (wrap) {
                    wrap.classList.add('is-en');
                    wrap.title = 'Switch to Chinese';
                }
                sendMessageToCpp('set_language|en');
            } else {
                currentLang = 'zh';
                if (wrap) {
                    wrap.classList.remove('is-en');
                    wrap.title = 'English';
                }
                sendMessageToCpp('set_language|zh');
            }
            localStorage.setItem('user_lang', currentLang);
            updateLanguageUI();
            renderFloatingWidget();
        }
        // --- Native File Probe via C++ backend (bypasses CORS) ---
        const metadataProbeExcludedHosts = new Set(['meow.668yun.top']);
        function isMetadataProbeExcludedUrl(url) {
            try {
                const parsed = new URL(String(url || ''));
                const host = parsed.hostname.toLowerCase().replace(/\.+$/, '');
                return metadataProbeExcludedHosts.has(host);
            } catch (e) {
                return false;
            }
        }
        var _probeCallbacks = {};
        var _probeIdCounter = 0;
        var jsMetadataCache = {};
        var _probeIdToUrl = {};
        var prefetchQueue = [];
        var isProcessingPrefetch = false;
        function probeFileInfo(softwareName, url, callback, bypassCache = false) {
            if (isMetadataProbeExcludedUrl(url)) {
                // Do not replay metadata left by a previous URL with the same name.
                if (softwareName) delete jsMetadataCache[softwareName];
                setTimeout(() => callback(0, ''), 0);
                return;
            }
            if (!bypassCache && jsMetadataCache[softwareName]) {
                setTimeout(() => {
                    callback(jsMetadataCache[softwareName].size, jsMetadataCache[softwareName].date);
                }, 0);
                return;
            }
            let id = 'p' + (++_probeIdCounter);
            _probeCallbacks[id] = callback;
            _probeIdToUrl[id] = bypassCache ? null : softwareName;
            
            let cmd = bypassCache ? 'probe_file_info_nocache|' : 'probe_file_info|';
            sendMessageToCpp(cmd + id + '|' + softwareName + '|' + url);
        }
        function clearMetadataCache() {
            sendMessageToCpp('user_click|清理功能|清空云端元数据缓存');
            sendMessageToCpp('clear_metadata_cache');
        }
        function prefetchItemsMetadata(items) {
            if (!Array.isArray(items)) return;
            items.forEach(item => {
                if (item && item.name && item.url && item.url.startsWith('http') &&
                    !isMetadataProbeExcludedUrl(item.url)) {
                    if (!prefetchQueue.some(p => p.name === item.name) && !jsMetadataCache[item.name]) {
                        prefetchQueue.push({ name: item.name, url: item.url });
                    }
                }
            });
            triggerPrefetchQueue();
        }

        function prioritizeCategoryPrefetch(items, immediate = false) {
            if (!Array.isArray(items)) return;
            let itemsToPrioritize = [];
            items.forEach(item => {
                if (item && item.name && item.url && item.url.startsWith('http') &&
                    !isMetadataProbeExcludedUrl(item.url)) {
                    itemsToPrioritize.push({ name: item.name, url: item.url });
                    prefetchQueue = prefetchQueue.filter(p => p.name !== item.name);
                }
            });
            prefetchQueue = itemsToPrioritize.concat(prefetchQueue);
            if (immediate) {
                if (!isProcessingPrefetch) {
                    isProcessingPrefetch = true;
                    processNextPrefetch();
                }
            } else {
                triggerPrefetchQueue();
            }
        }
        function triggerPrefetchQueue() {
            if (isProcessingPrefetch) return;
            isProcessingPrefetch = true;
            // 延迟1.5秒开始，确保不影响系统启动时的瞬间秒开首屏渲染！
            setTimeout(processNextPrefetch, 1500);
        }
        function processNextPrefetch() {
            if (prefetchQueue.length === 0) {
                isProcessingPrefetch = false;
                return;
            }
            let item = prefetchQueue.shift();
            if (jsMetadataCache[item.name]) {
                setTimeout(processNextPrefetch, 20);
                return;
            }
            probeFileInfo(item.name, item.url, function(size, time) {
                // 每个包获取间隔150毫秒，以极其温和与极其省电的背景慢速方式依次获取，绝不卡顿或占用网络资源！
                setTimeout(processNextPrefetch, 150);
            });
        }
        function bindDragEvent() {
            document.getElementById('dragRegion').addEventListener('mousedown', function (e) {
                if (e.target && e.target.closest && e.target.closest('.client-title-link')) return;
                if (e.button === 0) sendMessageToCpp('drag');
            });
            document.getElementById('windowControls').addEventListener('mousedown', function (e) { e.stopPropagation(); });
        }
        // Block F5/Ctrl+R refreshes
        window.addEventListener('keydown', function (event) {
            // Block F5 (116) and Ctrl+R / Ctrl+F5 refreshes
            if (event.keyCode === 116 || event.key === 'F5') {
                event.preventDefault();
                event.stopPropagation();
            }
            if (event.ctrlKey && (event.key === 'r' || event.key === 'R' || event.keyCode === 82)) {
                event.preventDefault();
                event.stopPropagation();
            }
        }, true);
        initApp();

</script>
<script>
/* 管理员开发选项：密码解锁后可自定义窗口标题、界面文案与外观（保存在本机，重启自动套用） */
(function () {
    var CFG_KEY = 'xq_dev_cfg';
    var PASS_KEY = 'xq_dev_pass';
    var DEFAULT_PASS = 'wo6qin8ren';
    var NAV_ORDER = ['首页', '软件下载', '日常维护', '调试工具', '小庆自用', '全局设置'];
    var NAV_EN = { '首页': 'Home', '软件下载': 'Downloads', '日常维护': 'Maintenance', '调试工具': 'Dev Tools', '小庆自用': 'My Library', '全局设置': 'Settings' };
    var TABS_DEFAULT = [['系统概述', 'OVERVIEW'], ['音频设置', 'AUDIO'], ['音频设备', 'DEVICES'], ['系统命令', 'COMMANDS']];
    var THEME_ACCENT = '#2f86f6';

    var cfg = null;
    var unlocked = false;
    var sentTitle = '';
    var sentGlass = null;
    var glassStateKnown = false;   /* 是否已从原生侧取回过磨砂状态 */
    var mo = null;
    var moTimer = null;

    function b64(text) {
        try { return btoa(unescape(encodeURIComponent(text))); } catch (e) { return ''; }
    }
    function defaults() {
        var d = { title: '', user: '', musicHead: '', scale: 100, accent: '', marquee: '', glass: '' };
        for (var i = 0; i < NAV_ORDER.length; i++) { d['nav' + i] = ''; d['navEn' + i] = ''; }
        for (var j = 0; j < 4; j++) { d['tab' + j] = ''; d['tabEn' + j] = ''; }
        return d;
    }
    function readCfg() {
        var d = defaults();
        try {
            var raw = localStorage.getItem(CFG_KEY);
            if (raw) {
                var p = JSON.parse(raw) || {};
                Object.keys(d).forEach(function (k) {
                    if (typeof p[k] === 'string' || typeof p[k] === 'number') d[k] = p[k];
                });
            }
        } catch (e) { /* ignore */ }
        return d;
    }
    function getPass() {
        try { return localStorage.getItem(PASS_KEY) || DEFAULT_PASS; } catch (e) { return DEFAULT_PASS; }
    }
    function hint(text, ok) {
        var el = document.getElementById('xqDevHint');
        if (!el) return;
        el.textContent = text || '';
        el.style.color = ok ? 'var(--color-accent)' : '#e0553d';
    }
    function setNodeText(node, text) {
        if (!node) return;
        for (var i = 0; i < node.childNodes.length; i++) {
            var c = node.childNodes[i];
            if (c.nodeType === 3 && c.nodeValue.trim()) {
                if (c.nodeValue !== text) c.nodeValue = text;
                return;
            }
        }
        if ((node.textContent || '').trim() !== text) node.appendChild(document.createTextNode(text));
    }

    function applyNav() {
        if (!cfg) return;
        var items = document.querySelectorAll('#sidebar .nav-item');
        for (var i = 0; i < items.length; i++) {
            var n = items[i];
            if (n.classList.contains('nav-separator')) continue;
            var base = n.getAttribute('data-xq-base');
            if (!base) {
                var cur = (n.textContent || '').trim();
                if (NAV_ORDER.indexOf(cur) < 0) continue;
                base = cur;
                n.setAttribute('data-xq-base', base);
            }
            var idx = NAV_ORDER.indexOf(base);
            if (idx < 0) continue;
            var zh = (cfg['nav' + idx] || '').trim() || base;
            var en = (cfg['navEn' + idx] || '').trim() || NAV_EN[base] || '';
            setNodeText(n, zh);
            if (n.getAttribute('data-en') !== en) n.setAttribute('data-en', en);
        }
        var uname = document.querySelector('.sidebar-username');
        if (uname) {
            var u = (cfg.user || '').trim() || '小庆';
            if ((uname.textContent || '').trim() !== u) uname.textContent = u;
        }
    }

    function applyTabs() {
        if (!cfg) return;
        var tabs = document.querySelectorAll('.home-overview-tab');
        for (var i = 0; i < tabs.length && i < 4; i++) {
            var zh = (cfg['tab' + i] || '').trim();
            var en = (cfg['tabEn' + i] || '').trim();
            var zt = tabs[i].querySelector('.zt');
            var ze = tabs[i].querySelector('.ze');
            if (zt && zh && zt.textContent !== zh) zt.textContent = zh;
            if (ze && en && ze.textContent !== en) ze.textContent = en;
        }
    }

    function applyMusic() {
        if (!cfg) return;
        var head = document.querySelector('#xqMusic .xq-mu-head > span');
        var zh = (cfg.musicHead || '').trim();
        if (head && zh && head.textContent !== zh) head.textContent = zh;
    }

    function applyLook() {
        if (!cfg) return;
        var scale = parseInt(cfg.scale, 10);
        if (!scale || scale < 80 || scale > 140) scale = 100;
        document.documentElement.style.zoom = (scale === 100) ? '' : String(scale / 100);
        var accent = (cfg.accent || '').trim();
        if (accent && accent !== THEME_ACCENT) document.documentElement.style.setProperty('--color-accent', accent);
        else document.documentElement.style.removeProperty('--color-accent');
    }

    function applyMarquee() {
        if (!cfg) return;
        var box = document.getElementById('xqMarquee');
        var track = document.getElementById('xqMarqueeTrack');
        var a = document.getElementById('xqMarqueeChunkA');
        var b = document.getElementById('xqMarqueeChunkB');
        if (!box || !track || !a || !b) return;
        var text = (cfg.marquee || '').trim();
        if (!text) {
            box.style.display = 'none';
            box.classList.remove('is-scrolling', 'is-static');
            if (a.textContent) a.textContent = '';
            if (b.textContent) b.textContent = '';
            return;
        }
        box.style.display = '';
        var unit = text + '　　　•　　　';
        if (a.textContent !== unit) a.textContent = unit;
        if (b.textContent !== unit) b.textContent = unit;
        requestAnimationFrame(function () {
            var w = a.scrollWidth;
            var boxW = box.clientWidth;
            if (w > boxW + 4) {
                track.style.setProperty('--xq-marquee-dur', Math.max(9, Math.round(w / 36)) + 's');
                box.classList.add('is-scrolling');
                box.classList.remove('is-static');
            } else {
                box.classList.remove('is-scrolling');
                box.classList.add('is-static');
            }
        });
    }

    /* ---- 磨砂底图：把桌面壁纸铺在窗口下方并模糊 ---- */
    function xqEnsureWallLayer() {
        var box = document.getElementById('xqWallLayer');
        if (box) return box;
        box = document.createElement('div');
        box.id = 'xqWallLayer';
        var img = document.createElement('div');
        img.id = 'xqWallImg';
        box.appendChild(img);
        if (document.body.firstChild) document.body.insertBefore(box, document.body.firstChild);
        else document.body.appendChild(box);
        return box;
    }

    function xqApplyWallData(data) {
        if (!data || !data.ok || !data.vw || !data.vh) return;
        var img = document.getElementById('xqWallImg');
        if (!img) return;
        /* 小庆魔方式对位：整屏截屏糊图按窗口在屏幕上的位置精确裁贴，
           外扩 pad 像素给 blur 留渗色边，移动窗口后看起来就是真磨砂玻璃 */
        var dpr = window.devicePixelRatio || 1;
        var pad = 30;
        var sw = data.vw / dpr, sh = data.vh / dpr;
        img.style.left = (-((data.wx || 0) - (data.vx || 0)) / dpr - pad) + 'px';
        img.style.top = (-((data.wy || 0) - (data.vy || 0)) / dpr - pad) + 'px';
        img.style.width = (sw + pad * 2) + 'px';
        img.style.height = (sh + pad * 2) + 'px';
        img.style.backgroundImage = 'url("' + (data.src || '../glass_wallpaper.jpg') + '?t=' + Date.now() + '")';
        img.style.backgroundSize = sw + 'px ' + sh + 'px';
        img.style.backgroundPosition = pad + 'px ' + pad + 'px';
        img.style.backgroundRepeat = 'no-repeat';
    }

    function xqRefreshWall() {
        if (!cfg || String(cfg.glass || '') !== '1') return;
        xqEnsureWallLayer();
        var img = document.getElementById('xqWallImg');
        /* 先用相对路径兜底（时间戳防缓存），再向原生要一张新鲜截屏底图 + 窗口几何 */
        if (img && !img.style.backgroundSize) img.style.backgroundImage = 'url("../glass_wallpaper.jpg?t=' + Date.now() + '")';
        try {
            if (typeof sendMessageToCpp === 'function') sendMessageToCpp('glass_wall');
        } catch (e) { /* ignore */ }
    }

    function applyGlass() {
        if (!cfg) return;
        var on = String(cfg.glass || '') === '1';
        if (on) {
            document.documentElement.setAttribute('data-glass', '1');
            xqRefreshWall();
        } else {
            document.documentElement.removeAttribute('data-glass');
        }
        var theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var key = on ? ('1|' + theme) : '0';
        var localSet = String(cfg.glass || '') !== '';
        /* 状态还没和原生侧对齐、本地又没设置过时先别下发，避免把上次开的磨砂覆盖成关 */
        if (!glassStateKnown && !localSet) return;
        if (sentGlass !== key) {
            sentGlass = key;
            try {
                if (typeof sendMessageToCpp === 'function') sendMessageToCpp('set_glass|' + key);
            } catch (e) { /* ignore */ }
        }
    }

    window.chrome && window.chrome.webview && window.chrome.webview.addEventListener('message', function (ev) {
        var data = ev && ev.data;
        if (typeof data !== 'string') return;
        if (data.indexOf('glass_wall|') === 0) {
            try { xqApplyWallData(JSON.parse(data.substring('glass_wall|'.length))); } catch (e) { /* ignore */ }
        } else if (data.indexOf('glass_state|') === 0) {
            /* 原生侧记住的状态优先，避免换电脑/清缓存后状态对不上 */
            var parts = data.split('|');
            var on = parts[1] === '1';
            glassStateKnown = true;
            if (!cfg) { window.xqGlassPending = on ? 1 : 0; return; }
            cfg.glass = on ? '1' : '';
            sentGlass = null;
            applyGlass();
        } else if (data === 'glass_move') {
            xqRefreshWall();
        }
    });
    /* 原生侧注入入口：窗口一建好就把记住的磨砂状态带过来 */
    window.xqGlassBoot = function (on) {
        glassStateKnown = true;
        if (!cfg) { window.xqGlassPending = on ? 1 : 0; return; }
        cfg.glass = on ? '1' : '';
        sentGlass = null;
        applyGlass();
    };

    var glassStateTries = 0;
    function xqAskGlassState() {
        if (glassStateKnown || glassStateTries >= 6) return;
        glassStateTries++;
        try {
            if (typeof sendMessageToCpp === 'function') sendMessageToCpp('glass_state');
        } catch (e) { /* ignore */ }
        setTimeout(xqAskGlassState, 1200);
    }
    setTimeout(xqAskGlassState, 200);
    var xqWallResizeT = 0;
    window.addEventListener('resize', function () {
        clearTimeout(xqWallResizeT);
        xqWallResizeT = setTimeout(function () { if (cfg && String(cfg.glass || '') === '1') xqRefreshWall(); }, 350);
    });

    function applyAll() {
        if (!cfg) cfg = readCfg();
        var title = (cfg.title || '').trim() || '小庆工具箱';
        if (document.title !== title) document.title = title;
        var bar = document.getElementById('clientTitleBar');
        if (bar && (bar.textContent || '').trim() !== title) bar.textContent = title;
        if ((cfg.title || '').trim() && sentTitle !== cfg.title) {
            sentTitle = cfg.title;
            try {
                if (typeof sendMessageToCpp === 'function') sendMessageToCpp('set_window_title|' + b64(cfg.title));
            } catch (e) { /* ignore */ }
        }
        applyNav();
        applyTabs();
        applyMusic();
        applyLook();
        applyMarquee();
        if (window.xqGlassPending !== undefined) {
            var pendingGlass = window.xqGlassPending;
            delete window.xqGlassPending;
            cfg.glass = pendingGlass ? '1' : '';
            sentGlass = null;
        }
        applyGlass();
        /* 原生桥可能比前端晚就绪，稍后再补发一次，避免启动时静默丢失 */
        setTimeout(function () { sentGlass = null; applyGlass(); }, 1200);
    }

    function fieldRow(label, key, ph, type) {
        return '<label style="display:flex;align-items:center;gap:10px;">' +
            '<span style="flex:0 0 96px;font-size:12.5px;color:var(--color-text-secondary);">' + label + '</span>' +
            '<input id="xqDev_' + key + '" class="direct-download-input" type="' + (type || 'text') + '" style="flex:1 1 auto;width:100%;min-width:120px;" placeholder="' + ph + '">' +
            '</label>';
    }
    function pairRow(label, keyZh, phZh, keyEn, phEn) {
        return '<div style="display:flex;gap:8px;align-items:center;">' +
            '<span style="flex:0 0 96px;font-size:12.5px;color:var(--color-text-secondary);">' + label + '</span>' +
            '<input id="xqDev_' + keyZh + '" class="direct-download-input" type="text" style="flex:1 1 0;width:100%;min-width:80px;" placeholder="' + phZh + '">' +
            '<input id="xqDev_' + keyEn + '" class="direct-download-input" type="text" style="flex:1 1 0;width:100%;min-width:80px;" placeholder="' + phEn + '">' +
            '</div>';
    }
    function section(title, body, open) {
        return '<details' + (open ? ' open' : '') + ' style="border:1px solid rgba(47,134,246,.14);border-radius:12px;padding:10px 12px;">' +
            '<summary style="cursor:pointer;font-size:13px;font-weight:600;">' + title + '</summary>' +
            '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">' + body + '</div>' +
            '</details>';
    }

    function gateHtml() {
        return '<div class="setting-info" style="display:block;">' +
            '<div class="setting-titleText">管理员开发选项</div>' +
            '<div class="direct-download-subtitle" style="margin-top:6px;">自定义窗口标题、界面文案与外观，需要管理员密码。</div>' +
            '</div>' +
            '<div class="direct-download-fields">' +
            '<input id="xqDevPass" class="direct-download-input" type="password" maxlength="64" autocomplete="off" placeholder="管理员密码">' +
            '</div>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">' +
            '<button type="button" class="direct-download-button" onclick="window.XQ_DEV.unlock()">解锁</button>' +
            '</div>' +
            '<div class="direct-download-subtitle" id="xqDevHint"></div>';
    }

    function panelHtml() {
        var navRows = '';
        NAV_ORDER.forEach(function (base, i) {
            navRows += pairRow(base, 'nav' + i, base, 'navEn' + i, NAV_EN[base] || '');
        });
        var tabRows = '';
        for (var i = 0; i < 4; i++) {
            tabRows += pairRow('标签 ' + (i + 1), 'tab' + i, TABS_DEFAULT[i][0], 'tabEn' + i, TABS_DEFAULT[i][1]);
        }
        var h = '';
        h += '<div class="setting-info" style="display:block;">' +
            '<div class="setting-titleText">已解锁 · 自定义外观与文案</div>' +
            '<div class="direct-download-subtitle" style="margin-top:6px;">改动只保存在本机，重启后自动套用；留空即使用默认文案。</div>' +
            '</div>';
        h += section('窗口与标识', fieldRow('窗口标题', 'title', '小庆工具箱') +
            fieldRow('侧栏用户名', 'user', '小庆') +
            fieldRow('音乐卡标题', 'musicHead', '音乐'), true);
        h += section('顶部滚动字幕',
            '<div class="direct-download-fields">' +
            '<input id="xqDev_marquee" class="direct-download-input" type="text" maxlength="120" style="width:100%;" placeholder="留空则隐藏，例如：小庆工具箱 · 欢迎回来">' +
            '</div>' +
            '<div class="direct-download-subtitle">彩色渐变文字，显示在标题栏右侧；比窗口宽时自动横向滚动。</div>');
        h += section('侧栏导航（中文 / 英文）', navRows);
        h += section('首页标签页（中文 / 英文）', tabRows);
        h += section('界面外观',
            '<label style="display:flex;align-items:center;gap:10px;">' +
            '<span style="flex:0 0 96px;font-size:12.5px;color:var(--color-text-secondary);">界面缩放</span>' +
            '<input id="xqDev_scale" class="direct-download-input" type="number" min="80" max="140" step="5" style="flex:1;min-width:0;" placeholder="100">' +
            '<span style="font-size:12px;color:var(--color-text-secondary);">%</span></label>' +
            '<label style="display:flex;align-items:center;gap:10px;">' +
            '<span style="flex:0 0 96px;font-size:12.5px;color:var(--color-text-secondary);">主题强调色</span>' +
            '<input id="xqDev_accent" type="color" style="width:52px;height:30px;border:0;background:none;padding:0;cursor:pointer;">' +
            '<span style="font-size:12px;color:var(--color-text-secondary);">默认 #2f86f6</span></label>' +
            '<label style="display:flex;align-items:center;gap:10px;">' +
            '<span style="flex:0 0 96px;font-size:12.5px;color:var(--color-text-secondary);">磨砂透明背景</span>' +
            '<input id="xqDev_glass" type="checkbox" style="width:18px;height:18px;cursor:pointer;">' +
            '<span style="font-size:12px;color:var(--color-text-secondary);">透出桌面壁纸的高斯模糊</span></label>');
        h += section('管理员密码',
            '<div class="direct-download-fields">' +
            '<input id="xqDevPassNew" class="direct-download-input" type="password" maxlength="64" autocomplete="off" placeholder="新管理员密码（留空不改）">' +
            '</div>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
            '<button type="button" class="direct-download-button" onclick="window.XQ_DEV.savePass()">修改密码</button>' +
            '</div>');
        h += '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">' +
            '<button type="button" class="direct-download-button" onclick="window.XQ_DEV.reset()">恢复默认</button>' +
            '<button type="button" class="direct-download-button" onclick="window.XQ_DEV.save()">保存并应用</button>' +
            '<button type="button" class="direct-download-button" onclick="window.XQ_DEV.lock()">锁定</button>' +
            '</div>' +
            '<div class="direct-download-subtitle" id="xqDevHint"></div>';
        return h;
    }

    function fill() {
        if (!cfg) cfg = readCfg();
        var set = function (key, val) {
            var el = document.getElementById('xqDev_' + key);
            if (el) el.value = val == null ? '' : val;
        };
        set('title', cfg.title);
        set('user', cfg.user);
        set('musicHead', cfg.musicHead);
        set('marquee', cfg.marquee);
        var gl = document.getElementById('xqDev_glass');
        if (gl) gl.checked = String(cfg.glass || '') === '1';
        for (var i = 0; i < NAV_ORDER.length; i++) { set('nav' + i, cfg['nav' + i]); set('navEn' + i, cfg['navEn' + i]); }
        for (var j = 0; j < 4; j++) { set('tab' + j, cfg['tab' + j]); set('tabEn' + j, cfg['tabEn' + j]); }
        set('scale', String(parseInt(cfg.scale, 10) || 100));
        var acc = document.getElementById('xqDev_accent');
        if (acc) acc.value = (cfg.accent && cfg.accent !== THEME_ACCENT) ? cfg.accent : THEME_ACCENT;
    }

    function collect() {
        var c = readCfg();
        var get = function (key) {
            var el = document.getElementById('xqDev_' + key);
            return el ? String(el.value || '').trim() : '';
        };
        c.title = get('title');
        c.user = get('user');
        c.musicHead = get('musicHead');
        c.marquee = get('marquee');
        var gl = document.getElementById('xqDev_glass');
        c.glass = (gl && gl.checked) ? '1' : '';
        for (var i = 0; i < NAV_ORDER.length; i++) { c['nav' + i] = get('nav' + i); c['navEn' + i] = get('navEn' + i); }
        for (var j = 0; j < 4; j++) { c['tab' + j] = get('tab' + j); c['tabEn' + j] = get('tabEn' + j); }
        c.scale = Math.max(80, Math.min(140, parseInt(get('scale'), 10) || 100));
        var acc = document.getElementById('xqDev_accent');
        c.accent = (acc && acc.value && acc.value.toLowerCase() !== THEME_ACCENT) ? acc.value : '';
        return c;
    }

    function mount() {
        var slot = document.getElementById('xqDevSlot');
        if (!slot) return;
        slot.innerHTML = unlocked ? panelHtml() : gateHtml();
        if (unlocked) fill();
    }

    function watchContent() {
        var box = document.getElementById('contentContainer') || document.querySelector('.content-inner');
        if (!box || !window.MutationObserver) return;
        if (mo) mo.disconnect();
        mo = new MutationObserver(function () {
            if (moTimer) clearTimeout(moTimer);
            moTimer = setTimeout(function () { applyTabs(); applyMusic(); }, 150);
        });
        mo.observe(box, { childList: true, subtree: true });
    }

    window.XQ_DEV = {
        mount: mount,
        applyNav: applyNav,
        applyAll: applyAll,
        unlock: function () {
            var el = document.getElementById('xqDevPass');
            var val = el ? String(el.value || '') : '';
            if (val && val === getPass()) {
                unlocked = true;
                mount();
                hint('已解锁，可修改下列项目', true);
            } else {
                hint('密码不对，请重试');
            }
        },
        lock: function () {
            unlocked = false;
            mount();
        },
        save: function () {
            cfg = collect();
            try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
            sentTitle = '';
            applyAll();
            hint('已保存并应用，重启后依然生效', true);
        },
        reset: function () {
            cfg = defaults();
            try { localStorage.removeItem(CFG_KEY); } catch (e) { /* ignore */ }
            sentTitle = '';
            applyAll();
            mount();
            hint('已恢复默认文案与外观', true);
        },
        savePass: function () {
            var el = document.getElementById('xqDevPassNew');
            var val = el ? String(el.value || '').trim() : '';
            if (val.length < 4) { hint('新密码至少 4 位'); return; }
            try { localStorage.setItem(PASS_KEY, val); } catch (e) { /* ignore */ }
            if (el) el.value = '';
            hint('管理员密码已更新', true);
        }
    };

    cfg = readCfg();
    applyAll();
    // 明暗切换后重算磨砂色调（深色冷灰 / 浅色乳白）
    try {
        new MutationObserver(function () { applyGlass(); })
            .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    } catch (e) { /* ignore */ }
    watchContent();
    setTimeout(function () { applyAll(); watchContent(); }, 600);
    setTimeout(function () { applyAll(); }, 2000);
})();
</script>

/* 浅色主题：奶白淡色调，底图提亮保证深色文字可读 */
:root:not([data-theme="dark"])[data-glass="1"] .app-container { background: rgba(255, 255, 255, .18) !important; }
:root:not([data-theme="dark"])[data-glass="1"] .sidebar { background: rgba(255, 255, 255, .42) !important; }
:root:not([data-theme="dark"])[data-glass="1"] .titlebar { background: rgba(255, 255, 255, .42) !important; }
:root:not([data-theme="dark"])[data-glass="1"] .content-inner { background: rgba(255, 255, 255, .08) !important; }
:root:not([data-theme="dark"])[data-glass="1"] .setting-card,
:root:not([data-theme="dark"])[data-glass="1"] .direct-download-card,
:root:not([data-theme="dark"])[data-glass="1"] .xq-music,
:root:not([data-theme="dark"])[data-glass="1"] .xq-wx-embed,
:root:not([data-theme="dark"])[data-glass="1"] .home-audio-card,
:root:not([data-theme="dark"])[data-glass="1"] .mic-lock-card,
:root:not([data-theme="dark"])[data-glass="1"] .system-overview-panel,
:root:not([data-theme="dark"])[data-glass="1"] .st-cat-card,
:root:not([data-theme="dark"])[data-glass="1"] .home-overview-tab-list {
    background: rgba(255, 255, 255, .40) !important;
}
/* 磨砂底图（小庆魔方方案）：原生抓一张「排除本窗口」的整屏快照当底图，
   前端按窗口几何精确对位 + 高斯模糊，面板半透明后就是桌面的真毛玻璃。
   下面的 cover 铺底只是几何数据到达前的兜底。 */
#xqWallLayer {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    overflow: hidden; pointer-events: none; z-index: -1; display: none;
    background: #10121a;
}
:root[data-glass="1"] #xqWallLayer { display: block; }
#xqWallImg {
    position: absolute; left: -8%; top: -8%; width: 116%; height: 116%;
    background-image: url("../glass_wallpaper.jpg");
    background-size: cover;
    background-position: center;
    filter: blur(22px) saturate(1.08);
    will-change: filter;
}
/* 深色主题压暗底图（小庆魔方的"压暗"步骤），浅色提亮，保证文字对比度 */
:root[data-theme="dark"][data-glass="1"] #xqWallImg { filter: blur(22px) saturate(1.05) brightness(.78); }
:root:not([data-theme="dark"])[data-glass="1"] #xqWallImg { filter: blur(22px) saturate(1.12) brightness(1.16); }
</style>
</body>
</html>
