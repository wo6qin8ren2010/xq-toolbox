                    if (list) {
                        list.innerHTML = items.length ? items.map(item => `<div class="studio-hook-process-row"><strong>${String(item.name || 'Studio One')}</strong><span>PID ${String(item.pid || '')}</span></div>`).join('') : '<div class="studio-hook-empty">暂无 Studio One / Studio Pro 进程</div>';

                }
                if (typeof event.data === 'string' && event.data.startsWith('studio_hook_result|')) {

                    try { data = JSON.parse(event.data.substring('studio_hook_result|'.length)); } catch (_) { data = { ok: false, message: 'Hook 结果格式无效' }; }
                    const status = document.getElementById('studioHookStatus');
                    const result = document.getElementById('studioHookResult');
                    if (status) status.textContent = data.ok ? (data.status === 'no_output' ? '未捕获到新工程' : 'Hook操作完成') : 'Hook操作失败';
                    if (result) result.textContent = data.message || (data.ok ? '操作完成' : '未知错误');
                    const targets = Array.isArray(data.targets) ? data.targets : [];
                    targets.forEach(item => appendUserLog(item.ok ? 'success' : 'error', `Hook ${item.name || item.pid || ''}`, item.message || '无详细信息'));
                    if (data.ok) {
                        appendUserLog('success', 'Hook解密完成', data.message || '操作完成');

                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('vst_plugins_result|')) {
                    const raw = event.data.substring('vst_plugins_result|'.length);
                    const separator = raw.indexOf('|');
                    const status = separator >= 0 ? raw.substring(0, separator) : raw;
                    const detail = separator >= 0 ? raw.substring(separator + 1) : '';

                        appendUserLog('info', '插件列表', '正在扫描常见 VST2/VST3 插件目录');
                    } else if (status === 'success') {
                        try {
                            const items = JSON.parse(detail || '[]');
                            if (typeof window.renderVstPluginList === 'function') window.renderVstPluginList(items);

                        } catch (_) {
                            appendUserLog('error', '插件列表失败', '扫描结果格式无效');

                    } else {

                        showToast('插件扫描失败，请查看操作日志', 4500);
                    }
                    return;

                if (typeof event.data === 'string' && event.data.startsWith('plugin_cleanup_result|')) {

                    const kind = parts[1] === 'waves' ? 'Waves' : '插件';
                    const status = parts[2] || 'failed';
                    const data = {};
                    parts.slice(3).forEach(part => {
                        const index = part.indexOf('=');
                        if (index > 0) data[part.substring(0, index)] = part.substring(index + 1);
                    });
                    const button = document.getElementById(parts[1] === 'waves' ? 'debugCleanupWavesBtn' : 'debugCleanupPluginsBtn');

                    }
                    if (status === 'running') {
                        appendUserLog('info', `清理${kind}`, parts[1] === 'waves'

                        appendUserLog('error', `清理${kind}失败`, `找到 ${data.found || '0'} 个，删除 ${data.deleted || '0'} 个，失败 ${data.failed || '0'} 个`);
                        showToast(`清理${kind}失败，请查看操作日志`, 5000);

                    return;

                if (typeof event.data === 'string' && event.data.startsWith('plugin_cleanup_item|')) {
                    const parts = event.data.split('|');
                    const kind = parts[1] === 'waves' ? 'Waves' : '插件';
                    const success = parts[2] === 'success';
                    const format = parts[3] || 'VST';
                    const path = parts[4] || '';
                    const detail = parts.slice(5).join('|');
                    appendUserLog(success ? 'success' : 'error', `${kind}${success ? '清理成功' : '清理失败'}`, success ? `${format}：${path}` : `${format}：${path}；${detail || '删除失败'}`);
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('vst_plugin_delete_result|')) {
                    const parts = event.data.split('|');
                    const status = parts[1] || 'failed';
                    const path = parts[2] || '';
                    if (status === 'success') {
                        const row = document.querySelector(`.plugin-inventory-row[data-plugin-path="${CSS.escape(path)}"]`);
                        if (row) row.remove();
                        appendUserLog('success', '删除插件成功', path);

                    } else {
                        const detail = parts.slice(3).join('|') || '目标不存在或删除失败';

                        showToast('插件删除失败，请查看操作日志', 4500);
                    }
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('vst_plugin_location_result|')) {
                    if (event.data.split('|')[1] !== 'success') {
                        appendUserLog('error', '打开插件位置失败', event.data.split('|').slice(2).join('|') || '插件位置不可用');
                        showToast('无法打开插件所在位置', 4000);
                    }
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('backup_exists_result|')) {
                    const raw = event.data.substring(21);
                    const flags = {};
                    raw.split('|').forEach(part => {
                        const [k, v] = part.split('=');
                        if (k) flags[k] = v === '1';
                    });
                    const names = [];
                    if (flags['kugou'])   names.push('酷狗音乐');
                    if (flags['qqmusic']) names.push('QQ音乐');
                    if (flags['netease']) names.push('网易云音乐');
                    if (flags['tt'])      names.push('TT语音娱乐版');
                    if (flags['yy'])      names.push('YY语音');
                    if (flags['sound'])   names.push('声音控制面板（默认播放/录音设备）');
                    if (flags['douyin'])  names.push('抖音直播伴侣');
                    if (names.length === 0) {
                        showToast(currentLang === 'zh' ? '未找到任何备份文件，请先执行备份操作' : 'No backup files found. Please backup first.');

                    }
                    const nameStr = names.join('、');
                    showCustomDialog(
                        currentLang === 'zh' ? '恢复备份' : 'Restore Backup',
                        currentLang === 'zh'
                            ? `将把 ${nameStr} 的配置文件恢复到原始位置，是否继续？`
                            : `Restore config files for ${nameStr} to their original locations. Continue?`,
                        () => { sendMessageToCpp("restore_backup_channel|"); },
                        false
                    );
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('restore_backup_result|')) {
                    const status = event.data.split('|')[1];
                    if (status === 'success') {
                        appendUserLog('success', '恢复备份完成', '配置文件已恢复到原始位置');

                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('disable_todesk_devices_result|')) {

                    const data = {};

                            : `<span>\u7981\u7528\u8bbe\u5907\u7ba1\u7406</span>`;
                    }
                    const matched = data.matched || '0';
                    const disabled = data.disabled || '0';
                    const already = data.already || '0';
                    const failed = data.failed || '0';
                    const screenRenamed = data.screenRenamed || '0';
                    const screenAlready = data.screenAlready || '0';
                    const screenFailed = data.screenFailed || '0';
                    const audioRemoved = data.audioRemoved || '0';
                    const driverRemoved = data.driverRemoved || '0';
                    const driverFailed = data.driverFailed || '0';
                    const rebootHint = data.reboot === '1' ? '\uFF0C\u8BF7\u91CD\u542F\u7535\u8111\u5B8C\u6210\u6E05\u7406' : '';
                    if (status === 'running') {

                    } else if (status === 'success') {
                        appendUserLog('success', 'ToDesk 设备处理完成', `已处理 ${data.disabled || '0'} 个设备，已禁用 ${data.already || '0'} 个`);
                        showToast(currentLang === 'zh' ? `ToDesk \u5904\u7406\u5B8C\u6210${rebootHint}` : `ToDesk processing completed${rebootHint}`, 4500);
                    } else if (status === 'not_found') {

                    } else if (status === 'partial') {

                        showToast(currentLang === 'zh' ? `ToDesk \u5DF2\u5904\u7406\uFF0C\u90E8\u5206\u9879\u672A\u5B8C\u6210${rebootHint}` : `ToDesk partially processed${rebootHint}`, 5000);
                    } else {

                        showToast(currentLang === 'zh' ? 'ToDesk \u5904\u7406\u5931\u8D25\uFF0C\u8BF7\u91CD\u8BD5' : 'ToDesk processing failed. Please retry.', 5000);

                if (typeof event.data === 'string' && event.data.startsWith('upload_logs_result|')) {
                    const payload = event.data.substring('upload_logs_result|'.length);
                    const splitAt = payload.indexOf('|');
                    const status = splitAt >= 0 ? payload.substring(0, splitAt) : payload;
                    const detail = splitAt >= 0 ? payload.substring(splitAt + 1) : '';
                    const btn = document.getElementById('logUploadBtn');
                    const statusText = document.getElementById('logUploadStatus');
                    if (btn && statusText) {

                        btn.innerText = currentLang === 'zh' ? '一键上传' : 'Upload';

                    parts.slice(2).forEach(part => {

                        if (index > 0) data[part.substring(0, index)] = part.substring(index + 1);

                }
                if (typeof event.data === 'string' && event.data.startsWith('restore_backup_effect_result|')) {
                    const parts = event.data.split('|');
                    const status = parts[1] || 'fail';
                    const data = {};
                    parts.slice(2).forEach(part => {
                        const index = part.indexOf('=');
                        if (index > 0) data[part.substring(0, index)] = part.substring(index + 1);
                    });
                    if (status === 'success') {
                        const restored = data.restored || '1';
                        const failed = data.failed || '0';
                        appendUserLog('success', '还原效果完成', `已还原 ${restored} 个效果到桌面${failed !== '0' ? `，失败 ${failed} 个` : ''}`);
                        showToast(currentLang === 'zh' ? `已还原 ${restored} 个效果到桌面${failed !== '0' ? `，失败 ${failed} 个` : ''}` : `Restored ${restored} effect(s) to Desktop`);
                    } else {
                        appendUserLog('error', '还原效果失败', `备份不存在、已损坏或无法写入桌面${data.failed ? `，失败 ${data.failed} 个` : ''}`);
                        showToast(currentLang === 'zh' ? '效果还原失败' : 'Effect restore failed');
                    }
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('delete_backup_effect_result|')) {
                    const parts = event.data.split('|');
                    const status = parts[1] || 'fail';
                    const data = {};
                    parts.slice(2).forEach(part => {
                        const index = part.indexOf('=');
                        if (index > 0) data[part.substring(0, index)] = part.substring(index + 1);
                    });
                    const deleted = data.deleted || '0';
                    const failed = data.failed || '0';
                    if (status === 'success') {
                        appendUserLog('success', '删除效果备份完成', `已删除 ${deleted} 个备份${failed !== '0' ? `，失败 ${failed} 个` : ''}`);
                        showToast(currentLang === 'zh' ? `已删除 ${deleted} 个效果备份${failed !== '0' ? `，失败 ${failed} 个` : ''}` : `Deleted ${deleted} effect backup(s)`);
                    } else {
                        appendUserLog('error', '删除效果备份失败', '备份不存在、已被占用或删除失败');
                        showToast(currentLang === 'zh' ? '删除效果备份失败' : 'Failed to delete effect backups');
                    }
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('lenovo_search_result|')) {
                    handleLenovoSoftwareSearchResult(event.data);
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('lenovo_download_result|')) {
                    handleLenovoSoftwareDownloadResult(event.data);
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('uu_download_result|')) {
                    handleUuOfficialDownloadResult(event.data);
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('external_download|')) {
                    try {
                        const payload = JSON.parse(event.data.substring('external_download|'.length));
                        const directUrl = String(payload && payload.url || '').trim();
                        const suggestedFileName = String(payload && payload.fileName || '').split(/[\\/]/).pop().trim();
                        if (!/^https?:\/\//i.test(directUrl)) throw new Error('invalid_download_url');
                        const displayName = (suggestedFileName || '联想软件下载')
                            .replace(/\.(exe|msi|zip|rar|7z|bat|cmd)$/i, '') || '联想软件下载';
                        showToast(`已获取 ${displayName} 下载链接，正在加入下载管理...`, 3500);
                        simulateDownload(displayName, null, directUrl, '', { suggestedFileName });
                    } catch (error) {
                        showToast('下载链接解析失败，请重新点击下载', 4000);
                    }
                    return;
                }
                // Handle file probe results from C++ backend
                if (typeof event.data === 'string' && event.data.startsWith('file_probe_result|')) {
                    let parts = event.data.split('|');
                    let cbId = parts[1];
                    let fileSize = parseInt(parts[2], 10);
                    let lastMod = parts.slice(3).join('|');
                    if (_probeCallbacks[cbId]) {
                        let keyName = _probeIdToUrl[cbId];
                        if (keyName) {
                            jsMetadataCache[keyName] = { size: fileSize, date: lastMod };
                            delete _probeIdToUrl[cbId];
                        }
                        _probeCallbacks[cbId](fileSize, lastMod);
                        delete _probeCallbacks[cbId];
                    }
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('cloud_data_cache|')) {
                    const proxyDataStr = event.data.substring('cloud_data_cache|'.length);
                    processCloudData(proxyDataStr, true);
                }
                if (typeof event.data === 'string' && event.data.startsWith('dashboard_cloud_data_cache|')) {
                    const proxyDataStr = event.data.substring('dashboard_cloud_data_cache|'.length);
                    processDashboardCloudData(proxyDataStr, true);
                }
                if (typeof event.data === 'string' && event.data.startsWith('driver_cloud_data_cache|')) {
                    const proxyDataStr = event.data.substring('driver_cloud_data_cache|'.length);
                    processDriverCloudData(proxyDataStr, true);
                }
                if (typeof event.data === 'string' && event.data.startsWith('shortcut_cloud_data_cache|')) {
                    const proxyDataStr = event.data.substring('shortcut_cloud_data_cache|'.length);
                    processShortcutCloudData(proxyDataStr, true);
                }
                if (typeof event.data === 'string' && event.data.startsWith('cloud_data|')) {
                    const proxyDataStr = event.data.substring(11);
                    processCloudData(proxyDataStr, false);
                }
                if (typeof event.data === 'string' && event.data.startsWith('dashboard_cloud_data|')) {
                    const proxyDataStr = event.data.substring(21);
                    processDashboardCloudData(proxyDataStr, false);
                }
                if (typeof event.data === 'string' && event.data.startsWith('driver_cloud_data|')) {
                    const proxyDataStr = event.data.substring(18);
                    processDriverCloudData(proxyDataStr, false);
                }
                if (typeof event.data === 'string' && event.data.startsWith('shortcut_cloud_data|')) {
                    const proxyDataStr = event.data.substring(20);
                    processShortcutCloudData(proxyDataStr, false);
                }
                if (typeof event.data === 'string' && event.data.startsWith('config_data|')) {
                    applyConfig(event.data.substring(12));
                }
                if (typeof event.data === 'string' && event.data.startsWith('route_status|')) {
                    const parts = event.data.split('|');
                    if (parts.length >= 4) {
                        routePreference = normalizeRoutePreference(parts[1] || routePreference);
                        detectedIspName = parts[2] || '未知';
                        effectiveDownloadRoute = parts[3] || '';
                        updateSettingsStatusText();
                    }
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('download_route_result|')) {
                    const parts = event.data.split('|');
                    const id = parts[1] || '';
                    const result = parts[2] || '';
                    const dl = downloads.find(d => d.id === id);
                    if (result === 'started') {
                        // \u5207\u6362\u6210\u529f\uff1a\u539f\u751f\u5df2\u6e05\u7406\u65e7\u5206\u7247\u5e76\u4ece\u5934\u4e0b\u8f7d\uff0c\u6b64\u65f6\u624d\u6e05\u96f6 UI \u8fdb\u5ea6
                        if (dl && parts.length >= 4) {
                            dl.url = parts.slice(3).join('|');
                            dl.actualRoute = inferDownloadRouteFromUrl(dl.url);
                            if (!dl.routeMode || dl.routeMode === 'original' || dl.routeMode === 'signed_direct') dl.routeMode = 'manual';
                        }
                        if (dl) {
                            dl.downloaded = 0;
                            dl.total = 0;
                            dl.speed = 0;
                            dl._lastDownloadedMB = 0;
                            dl._lastProgressAt = 0;
                            dl._speedAnomalyUntil = 0;
                            dl._pendingRouteSwitch = false;
                            dl._pendingRouteTarget = '';
                            dl._routeSwitchOwnsSlot = false;
                            dl.status = 'downloading';
                            dl.phase = 'downloading';
                            expandedDownloadRouteIds.delete(dl.id);
                        }
                        showToast(uiText('\u5df2\u5207\u6362\u7ebf\u8def\u5e76\u91cd\u65b0\u5f00\u59cb\u4e0b\u8f7d', 'Route switched and download restarted'));
                    } else if (result === 'signed') {
                        // \u5207\u6362\u88ab\u62d2\u7edd\uff1a\u65e7\u4e0b\u8f7d\u4ecd\u5728\u539f\u7ebf\u8def\u7ee7\u7eed\uff0c\u6062\u590d\u5207\u6362\u524d\u72b6\u6001\u4e0e\u5df2\u6709\u8fdb\u5ea6
                        restoreDownloadAfterRouteSwitchFailure(dl);
                        showToast(uiText('\u7b7e\u540d\u94fe\u63a5\u4e0d\u80fd\u76f4\u63a5\u5207\u6362\u7ebf\u8def', 'Signed link cannot switch route directly'), 5000);
                    } else if (result === 'busy') {
                        // \u65e7\u4e0b\u8f7d\u672a\u80fd\u53ca\u65f6\u505c\u4e0b\uff0c\u4ecd\u5728\u539f\u7ebf\u8def\u7ee7\u7eed\uff0c\u6062\u590d\u539f\u72b6\u6001\u4e0e\u8fdb\u5ea6
                        restoreDownloadAfterRouteSwitchFailure(dl);
                        showToast(uiText('\u65e7\u4e0b\u8f7d\u8fd8\u6ca1\u5b8c\u5168\u505c\u4e0b\uff0c\u5df2\u7ee7\u7eed\u539f\u7ebf\u8def\u4e0b\u8f7d', 'Previous download continues on the current route'), 5000);
                    } else if (result === 'unsupported') {
                        restoreDownloadAfterRouteSwitchFailure(dl);
                        showToast(uiText('\u8fd9\u4e2a\u94fe\u63a5\u4e0d\u652f\u6301\u5207\u6362\u7ebf\u8def', 'This link does not support route switching'), 5000);
                    }
                    saveHistory();
                    updateAllUI();
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('admin_status|')) {
                    adminStartupStatus = event.data.split('|')[1] === '1';
                    updateSettingsStatusText();
                    if (!adminStartupStatus) {
                        showAdminRequiredPrompt('', true);
                    }
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('admin_required|')) {
                    appendUserLog('warning', '操作未执行', '需要以管理员身份运行程序');
                    const actionKey = event.data.split('|')[1] || '';
                    const actionName = actionKey === 'one_click_optimize'
                        ? (i18n[currentLang].oneClickOptimize || '\u4e00\u952e\u4f18\u5316')
                        : (actionKey === 'disable_todesk_devices' ? '\u7981\u7528\u8bbe\u5907\u7ba1\u7406' : '');
                    adminStartupStatus = false;
                    if (actionKey === 'one_click_optimize') setOneClickOptimizeButtonRunning(false);
                    updateSettingsStatusText();
                    showAdminRequiredPrompt(actionName, false);
                    return;
                }
                if (typeof event.data === 'string' && event.data.startsWith('history_data|')) {
                    try {
                        const histArray = JSON.parse(event.data.substring(13));
                        if (Array.isArray(histArray)) {
                            downloads = [];
                            if (histArray.length > 0) {
                                try {
                                    localStorage.setItem('hasDownloadedBefore', 'true');
                                } catch (e) {}
                                window._hasDownloadedBefore = true;
                            }
                            histArray.forEach(dl => {
                                if (dl.status === 'downloading' || dl.status === 'queued' || dl.status === 'checking_size') dl.status = 'paused';
                                // Older Lenovo single-download tasks were always marked silent. Migrate them
                                // back to the global auto-open policy while preserving intentional batch silence.
                                const isLegacyLenovoSingleDownload = String(dl.id || '').startsWith('lenovo_dl_');
                                dl.suppressAutoOpen = isLegacyLenovoSingleDownload ? false : !!dl.suppressAutoOpen;
                                dl.nativeNoOpen = isLegacyLenovoSingleDownload || !!dl.nativeNoOpen;
                                dl._queueManaged = true;
                                dl.actualRoute = normalizeDownloadRoute(dl.actualRoute || inferDownloadRouteFromUrl(dl.url));
                                dl.routeMode = dl.routeMode || inferDownloadRouteMode(dl);
                                dl._pendingRouteSwitch = false;
                                dl._pendingRouteTarget = '';
                                dl._routeSwitchOwnsSlot = false;
                                dl.directDownload = !!dl.directDownload;
                                
                                downloads.push(dl);
                                if (dl.status === 'completed') {
                                    sendMessageToCpp('check_file_exists|' + dl.id + '|' + dl.savePath);
                                }
                            });
                            updateAllUI();
                        }
                    } catch (e) {
                        console.error('加载历史记录失败:', e);
                    }
                }
                if (typeof event.data === 'string' && event.data.startsWith('file_exists_result|')) {
                    const parts = event.data.split('|');
                    if (parts.length >= 3) {
                        const id = parts[1];
                        const exists = parts[2] === '1';
                        const isDownloadOnly = pendingDownloadOnlyChecks.has(id);
                        pendingDownloadOnlyChecks.delete(id);
                        if (isDownloadOnly) {
                            const dl = downloads.find(d => d.id === id);
                            if (dl) {
                                if (exists) {
                                    showToast('安装包已下载完成，可在下载管理中查看');
                                } else {
                                    // 历史说完成，但文件已被移走或删除：重新下载，不能再谎报"已完成"
                                    dl.status = 'downloading';
                                    dl.downloaded = 0;
                                    dl.total = 0;
                                    dl.speed = 0;
                                    dl._lastDownloadedMB = 0;
                                    dl._lastProgressAt = 0;
                                    dl._speedAnomalyUntil = 0;
                                    dl.phase = 'downloading';
                                    if (dl.btnEl && document.body.contains(dl.btnEl)) {
                                        setDownloadButtonDownloading(dl.btnEl);
                                    }
                                    sendStartDownloadCommand(dl);
                                    showToast('原文件已不在，正在重新下载');
                                }
                                saveHistory();
                                updateAllUI();
                            }
                        }
                        const isUserAction = pendingUserChecks.has(id);
                        pendingUserChecks.delete(id);
                        if (isUserAction) {
                            // User clicked the button, decide: run or re-download
                            const dl = downloads.find(d => d.id === id);
                            if (dl) {
                                if (exists) {
                                    const lowerSavePath = dl.savePath ? dl.savePath.toLowerCase() : '';
                                    const openFileExts = ['.exe', '.msi', '.zip', '.rar', '.7z', '.bat', '.cmd', '.vbs'];
                                    if (dl.savePath && openFileExts.some(ext => lowerSavePath.endsWith(ext))) {
                                        sendMessageToCpp('open_file|' + dl.savePath);
                                    } else if (dl.savePath) {
                                        let dirPath = dl.savePath;
                                        let lastSlash = dirPath.lastIndexOf('\\');
                                        if (lastSlash === -1) lastSlash = dirPath.lastIndexOf('/');
                                        if (lastSlash !== -1) dirPath = dirPath.substring(0, lastSlash);
                                        sendMessageToCpp('open_file|' + dirPath);
                                    }
                                } else {
                                    dl.status = 'downloading';
                                    dl.downloaded = 0;
                                    dl.total = 0;
                                    dl.speed = 0;
                                    dl._lastDownloadedMB = 0;
                                    dl._lastProgressAt = 0;
                                    dl._speedAnomalyUntil = 0;
                                    dl.phase = 'downloading';
                                    updateAllUI();
                                    if (dl.btnEl && document.body.contains(dl.btnEl)) {
                                        setDownloadButtonDownloading(dl.btnEl);
                                    }
                                    sendStartDownloadCommand(dl);
                                    saveHistory();
                                }
                            }
                        } else {
                            // A removable or network drive may only be temporarily unavailable.
                            // Keep the original history entry; a user click will recheck and offer redownload.
                        }
                    }
                }
                if (typeof event.data === 'string' && event.data.startsWith('password_result|')) {
                    const resultParts = event.data.split('|');
                    const resultCode = resultParts[1] || '0';
                    if (resultCode === '1') {
                        isUnlocked = true;
                        enteredPassword = '';
                        passwordNotReadyRetries = 0;
                        if (passwordCheckTimer) {
                            clearTimeout(passwordCheckTimer);
                            passwordCheckTimer = null;
                        }
                        if (isProtectedPasswordInput(document.activeElement)) {
                            document.activeElement.blur();
                        }
                        setPasswordImeGuard(false);
                        const input = document.getElementById('authPasswordInput');
                        if (input) {
                            input.value = '';
                            input.style.display = 'none';
                        }
                        const centerInput = document.getElementById('centerAuthPasswordInput');
                        if (centerInput) centerInput.value = '';
                        const profileDiv = document.querySelector('.sidebar-profile > div');
                        if (profileDiv) profileDiv.style.marginBottom = '0';
                        if (window.xqLibActive && typeof window.xqLibAfterUnlock === 'function') {
                            window.xqLibAfterUnlock();
                        } else {
                            loadCategory(currentViewIndex);
                        }
                    } else if (resultCode === '2') {
                        const retrySeconds = Math.max(1, parseInt(resultParts[2] || '1', 10) || 1);
                        showToast(uiText(`尝试次数过多，请在 ${retrySeconds} 秒后重试`, `Too many attempts. Try again in ${retrySeconds}s`));
                    } else if (resultCode === '3' && enteredPassword && passwordNotReadyRetries < 5) {
                        passwordNotReadyRetries += 1;
                        const candidate = enteredPassword;
                        passwordCheckTimer = setTimeout(() => {
                            passwordCheckTimer = null;
                            if (!isUnlocked && enteredPassword === candidate) {
                                sendMessageToCpp('check_password|' + candidate);
                            }
                        }, 1000);
                    } else if (resultCode === '0') {
                        showToast(uiText('访问密码错误，请重试', 'Wrong password, try again'));
                    }
                }
                if (event.data === 'auth_required') {
                    isUnlocked = false;
                    loadCategory(currentViewIndex);
                }
                if (typeof event.data === 'string' && event.data.startsWith('{')) {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'download_route_state') {
                            const dl = downloads.find(d => d.id === msg.id);
                            if (dl) {
                                if (dl.routeSource === 'lenovo_store') return;
                                dl.actualRoute = normalizeDownloadRoute(msg.route || inferDownloadRouteFromUrl(msg.url || dl.url));
                                dl.routeMode = String(msg.mode || inferDownloadRouteMode(dl));
                                if (typeof msg.url === 'string' && msg.url) dl.url = msg.url;
                                if (dl.routeMode === 'fallback') {
                                    dl.downloaded = 0;
                                    dl.total = 0;
                                    dl.speed = 0;
                                    dl._lastDownloadedMB = 0;
                                    dl._lastProgressAt = 0;
                                    dl._speedAnomalyUntil = 0;
                                    dl.phase = 'switching_route';
                                }
                                saveHistory();
                                updateAllUI();
                            }
                            return;
                        }
                        if (msg.type === 'dl_progress') {
                            const dl = downloads.find(d => d.id === msg.id);
                            if (dl) {
                                if (typeof msg.path === 'string' && msg.path && dl.savePath !== msg.path) {
                                    dl.savePath = msg.path;
                                    saveHistory();
                                }
                                const nowForSpeedCheck = Date.now();
                                applyDownloadProgressSnapshot(dl, msg, nowForSpeedCheck);
                                if (msg.err) {
                                    dl.speed = 0;
                                    if (dl.status !== 'error') {
                                        dl.status = 'error';
                                        releaseDownloadSlot(dl.id);
                                        saveHistory();
                                    }
                                    if (dl.btnEl && document.body.contains(dl.btnEl)) {
                                        setDownloadButtonError(dl.btnEl);
                                    }
                                } else if (msg.paused) {
                                    dl.speed = 0;
                                    if (dl.status !== 'paused') {
                                        dl.status = 'paused';
                                        saveHistory();
                                    }
                                    if (dl._queueManaged) {
                                        releaseDownloadSlot(dl.id);
                                    }
                                    if (dl.btnEl && document.body.contains(dl.btnEl)) {
                                        setDownloadButtonPaused(dl.btnEl);
                                    }
                                } else if (msg.done) {
                                    const justCompleted = dl.status !== 'completed';
                                    dl.downloaded = dl.total;
                                    dl.speed = 0;
                                    dl._speedAnomalyUntil = 0;
                                    if (justCompleted) {
                                        dl.status = 'completed';
                                        expandedDownloadRouteIds.delete(dl.id);
                                        saveHistory();
                                        if (dl.btnEl && document.body.contains(dl.btnEl)) {
                                            flashDownloadButtonCompleted(dl);
                                        }
                                        // 完成消息可能连续回传，自动打开只能执行一次。
                                        openCompletedDownloadIfEnabled(dl);
                                        releaseDownloadSlot(dl.id);
                                    }
                                } else {
                                    if (dl.status !== 'downloading') {
                                        dl.status = 'downloading';
                                        saveHistory();
                                    }
                                    if (dl.btnEl && document.body.contains(dl.btnEl)) {
                                        setDownloadButtonDownloading(dl.btnEl);
                                    }
                                }
                                updateAllUI();
                            }
                        }
                    } catch (e) { }
                }
                if (event.data.startsWith('selected_dir:')) {
                    let newDir = event.data.substring(13);
                    if (!isSameWindowsPath(defaultDownloadPath, newDir)) {
                        defaultDownloadPath = newDir;
                        const dlPathEl = document.getElementById('dlPathInput');
                        if (dlPathEl) {
                            dlPathEl.textContent = defaultDownloadPath;
                        }
                        if (typeof checkAndFixHistoryPaths === 'function') {
                            checkAndFixHistoryPaths();
                        }
                        saveSettings();
                    }
                }
            });
            // 请求加载配置
            sendMessageToCpp('load_config');
            sendMessageToCpp('load_history');
            // 资源目录由“软件登录”入口在会员验证成功后读取，启动时不加载旧回退数据。
            sendMessageToCpp('fetch_dashboard_cloud');
        }
        // --- 设置持久化 ---

</script>
    <script>
function saveSettings() {
            const configStr = `${defaultDownloadPath}|list|${autoOpenExe ? '1' : '0'}|${sidebarPosition}|${autoPopupDl ? '1' : '0'}|${themeOption}|${routePreference}|0`;
            sendMessageToCpp('save_config|' + configStr);
        }
        function checkAndFixHistoryPaths() {
            if (typeof downloads === 'undefined' || downloads.length === 0) return;
            downloads.forEach(dl => {
                if (dl.savePath && dl.status === 'completed') {
                    sendMessageToCpp('check_file_exists|' + dl.id + '|' + dl.savePath);
                }
            });
        }
        function getRoutePreferenceLabel(value) {
            if (value === 'mobile') return getLangValue('sMobileRoute');
            if (value === 'telecom') return getLangValue('sTelecomRoute');
            return getLangValue('sAutoRoute');
        }
        function normalizeRoutePreference(value) {
            if (value === '移动' || value === 'mobile') return 'mobile';
            if (value === '电信' || value === 'telecom') return 'telecom';
            return 'auto';
        }
        function normalizeThemeOption(value) {
            if (value === 'auto' || value === 'light' || value === 'dark') return value;
            if (value === '浅色') return 'light';
            if (value === '深色') return 'dark';
            return 'auto';
        }
        function getFallbackEffectiveRoute() {
            if (routePreference === 'mobile') return '移动';
            if (routePreference === 'telecom') return '电信';
            if (detectedIspName === '电信') return '电信';
            if (detectedIspName === '移动' || detectedIspName === '联通') return '移动';
            return '';
        }
        function getAdminStartupText() {
            if (adminStartupStatus === null) {
                return `${i18n[currentLang].sAdminStartupStatus}：${i18n[currentLang].sAdminStartupChecking}`;
            }
            return `${i18n[currentLang].sAdminStartupStatus}：${adminStartupStatus ? i18n[currentLang].sAdminStartupAdmin : i18n[currentLang].sAdminStartupUser}`;
        }
        function getDownloadRouteStatusText() {
            const routeInfo = getRouteStatusDetails();
            return `${getLangValue('sCurrentDownloadRoute')}：${routeInfo.routeName}（${routeInfo.modeText}，${routeInfo.prefLabel}，${routeInfo.ispText}）`;
        }
        function updateSettingsStatusText() {
            const adminEl = document.getElementById('adminStartupStatusText');
            if (adminEl) adminEl.textContent = getAdminStartupText();
            const routeEl = document.getElementById('downloadRouteStatusText');
            if (routeEl) routeEl.textContent = getDownloadRouteStatusText();
        }
        function applyConfig(configStr) {
            try {
                const parts = configStr.split('|');
                if (parts.length >= 1 && parts[0]) {
                    if (!isSameWindowsPath(defaultDownloadPath, parts[0])) {
                        defaultDownloadPath = parts[0];

function showPluginContextMenu(event, plugin) {
    event.preventDefault();
    event.stopPropagation();
    removePluginContextMenu();
    const menu = document.createElement('div');
    menu.className = 'custom-context-menu plugin-context-menu';
    menu.innerHTML = '<div class="context-menu-item" data-action="location"><span class="context-menu-text">所在位置</span></div><div class="context-menu-item" data-action="delete"><span class="context-menu-text">删除插件</span></div>';
    menu.style.left = `${Math.min(event.clientX, Math.max(8, window.innerWidth - 190))}px`;
    menu.style.top = `${Math.min(event.clientY, Math.max(8, window.innerHeight - 100))}px`;
    document.body.appendChild(menu);
    const closeMenu = (mouseEvent) => {
        if (mouseEvent && menu.contains(mouseEvent.target)) return;
        removePluginContextMenu();
        document.removeEventListener('mousedown', closeMenu);
    };
    menu.querySelector('[data-action="location"]').addEventListener('click', () => {
        removePluginContextMenu();
        document.removeEventListener('mousedown', closeMenu);
        const location = plugin.actualPath || plugin.path || '';
        appendUserLog('info', '打开插件位置', location);
        sendMessageToCpp('open_vst_plugin_location|' + location);
    });
    menu.querySelector('[data-action="delete"]').addEventListener('click', () => {
        removePluginContextMenu();
        document.removeEventListener('mousedown', closeMenu);
        showCustomDialog('删除插件', `确定删除“${plugin.name}”吗？此操作不可撤销。`, () => {

        }, false);
    });
    setTimeout(() => document.addEventListener('mousedown', closeMenu), 0);
}

        list.innerHTML = '<div class="plugin-inventory-empty">未找到 VST2/VST3 插件</div>';
        return;
    }
    items.forEach(plugin => {
        const row = document.createElement('div');
        row.className = 'plugin-inventory-row';
        row.dataset.pluginPath = String(plugin.path || '');
        const name = document.createElement('div');
        name.className = 'plugin-inventory-name';
        name.textContent = plugin.name || '未命名插件';
        const format = document.createElement('span');
        format.className = 'plugin-inventory-format';
        format.textContent = plugin.format || 'VST';
        name.appendChild(format);
        const path = document.createElement('div');
        path.className = 'plugin-inventory-path';
        const hostPath = String(plugin.path || '');
        const actualPath = String(plugin.actualPath || hostPath);
        if (plugin.isLink && actualPath && actualPath !== hostPath) {
            path.textContent = `真实位置：${actualPath}`;
            path.title = `入口：${hostPath}\n真实位置：${actualPath}`;
        } else {
            path.textContent = actualPath;
            path.title = actualPath;
        }

function createStudioSongToolSection(kind) {
    const section = document.createElement('section');
    const isDowngrade = kind === 'downgrade';
    const title = isDowngrade ? '工程降级' : '文件解密';
    const description = isDowngrade
        ? '必须是非加密效果，解密后的效果可在任何64位Studio One宿主运行。'
        : '不敢保证所有加密效果可解，这东西道高一尺魔高一丈！';
    const inputId = isDowngrade ? 'studioDowngradePath' : 'studioDecryptPath';
    const selectMessage = isDowngrade ? 'studio_downgrade_select' : 'studio_file_decrypt_select';
    const actionMessage = isDowngrade ? 'studio_downgrade_start|' : 'studio_file_decrypt_start|';
    const dropTitle = isDowngrade ? '将 .song 文件拖到这里开始降级' : '将 .song 文件拖到这里';
    const dropHint = isDowngrade
        ? '拖入后立即开始降级，也可以使用下方的选择文件'
        : '拖入后立即开始解密，也可以使用下方的选择文件';
    section.className = 'project-decrypt-panel studio-project-tool-panel';
    section.innerHTML = `
        <div class="project-decrypt-heading">${title}</div>
        <div class="project-decrypt-subtitle">${description}</div>
        <div class="studio-project-drop-zone" tabindex="0" role="button" aria-label="拖入 .song 文件"><div class="studio-project-drop-icon" aria-hidden="true">↓</div><div class="studio-project-drop-title">${dropTitle}</div><div class="studio-project-drop-hint">${dropHint}</div></div>
        <div class="studio-project-file-row">
            <input id="${inputId}" class="studio-project-file-input" type="text" readonly placeholder="请选择 .song 文件">
            <button type="button" class="advanced-optimize-btn studio-project-select">选择文件</button>
        </div>
        ${isDowngrade ? '<label class="studio-project-version">目标版本<input id="studioDowngradeVersion" type="text" value="3.5.4.45392" spellcheck="false"></label>' : ''}
        <div class="studio-project-actions">
            <button type="button" class="advanced-optimize-btn studio-project-run" disabled>${isDowngrade ? '开始降级' : '开始解密'}</button>
            <span class="studio-project-status">等待选择文件</span>
        </div>
        <div class="studio-project-result" aria-live="polite"></div>
    `;
    const input = section.querySelector(`#${inputId}`);
    const select = section.querySelector('.studio-project-select');
    const run = section.querySelector('.studio-project-run');
    const status = section.querySelector('.studio-project-status');
    select.addEventListener('click', () => sendMessageToCpp(selectMessage));
    {
        const dropZone = section.querySelector('.studio-project-drop-zone');
        const updateDropState = (active) => dropZone.classList.toggle('is-dragging', active);
        dropZone.addEventListener('dragenter', event => { event.preventDefault(); updateDropState(true); });
        dropZone.addEventListener('dragover', event => { event.preventDefault(); updateDropState(true); });
        dropZone.addEventListener('dragleave', event => {
            event.preventDefault();
            if (!dropZone.contains(event.relatedTarget)) updateDropState(false);
        });
        dropZone.addEventListener('drop', event => {
            event.preventDefault();
            updateDropState(false);
            const file = event.dataTransfer?.files?.[0];
            const path = file?.path || '';
            if (!path) {
                status.textContent = `当前拖放未返回文件路径，请使用选择文件`;
                appendUserLog('warning', title, '拖放未取得本地路径，请改用选择文件');
                return;
            }
            sendMessageToCpp('studio_file_drop_path|' + path);
        });
        dropZone.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                sendMessageToCpp(selectMessage);
            }
        });
    }
    run.addEventListener('click', () => {
        const path = input.value.trim();
        if (!path) return;
        run.disabled = true;
        status.textContent = isDowngrade ? '正在降级...' : '正在解密...';
        setDebugInspectionTab('logs');
        appendUserLog('info', title, `开始处理：${path}`);
        if (isDowngrade) {
            const version = section.querySelector('#studioDowngradeVersion').value.trim() || '3.5.4.45392';
            sendMessageToCpp(`${actionMessage}${path}|${version}`);
        } else {
            sendMessageToCpp(`${actionMessage}${path}`);
        }
    });
    return section;
}

    captureVolume.addEventListener('pointerdown', () => { captureVolume.dataset.dragging = 'true'; });
    captureVolume.addEventListener('input', () => {
        captureVolume.dataset.userSelected = 'true';
        captureVolumeValue.textContent = captureVolume.value + '%';
        if (captureLockButton.dataset.locked === 'true') queueCaptureLockUpdate();
    });
    captureVolume.addEventListener('pointerup', () => {
        captureVolume.dataset.dragging = 'false';
        if (captureLockButton.dataset.locked === 'true') {
            if (captureLockUpdateTimer) window.clearTimeout(captureLockUpdateTimer);
            captureLockUpdateTimer = 0;
            sendCaptureLock(true);
            window.setTimeout(requestCaptureLockStatus, 250);
        } else {
            if (captureLockUpdateTimer) window.clearTimeout(captureLockUpdateTimer);
            captureLockUpdateTimer = 0;
            sendCaptureVolume();
            window.setTimeout(requestCaptureLockStatus, 250);
        }
    });
    captureVolume.addEventListener('change', () => {
        captureVolume.dataset.dragging = 'false';
        if (captureLockButton.dataset.locked === 'true') sendCaptureLock(true);
        else sendCaptureVolume();
    });
    const toggleCaptureLock = (locked) => {
        const stateLabel = section.querySelector('#homeCaptureLockState');
        if (stateLabel) { stateLabel.textContent = locked ? '正在开启...' : '正在关闭...'; stateLabel.className = 'audio-lock-state is-pending'; }
        if (captureLockStatus) { captureLockStatus.textContent = locked ? '正在开启内录音量锁定...' : '正在关闭内录音量锁定...'; captureLockStatus.className = 'audio-setting-status is-pending'; }
        captureLockButton.dataset.locked = locked ? 'pending-on' : 'pending-off';
        sendCaptureLock(locked);
    };
    captureLockButton.addEventListener('change', event => toggleCaptureLock(event.currentTarget.value === '1'));
    requestCaptureLockStatus();
    window.homeCaptureLockStatusTimer = window.setInterval(requestCaptureLockStatus, 600);
    section.querySelectorAll('[data-audio-tool]').forEach(button => button.addEventListener('click', () => sendMessageToCpp('open_system_tool|' + button.dataset.audioTool)));
    return section;
}

window.renderHomeAudioDevices = function (items) {
    window.homeAudioEndpointItems = items || [];
    const output = document.getElementById('homeAudioOutputSelect');
    const input = document.getElementById('homeAudioInputSelect');
    const fill = (select, capture) => {
        if (!select) return;
        select.innerHTML = '';
        const available = items.filter(item => !!item.capture === capture && (item.enabled || item.default));
        (available.length ? available : items.filter(item => !!item.capture === capture)).forEach(item => {
            const option = document.createElement('option');
            option.value = String(items.indexOf(item));
            option.textContent = item.name + (item.default ? '（当前默认）' : '');
            option.selected = !!item.default;
            option.disabled = !item.enabled && !item.default;
            select.appendChild(option);
        });
    };
    fill(output, false); fill(input, true);
    const renderList = document.getElementById('audioRenderEndpointList');
    const captureList = document.getElementById('audioCaptureEndpointList');
    const render = items.filter(item => !item.capture);
    const capture = items.filter(item => !!item.capture);
    const makeList = (list, values) => {
        if (!list) return;
        list.innerHTML = '';
        if (!values.length) { list.innerHTML = '<div class="audio-endpoint-empty">未发现设备</div>'; return; }
        values.forEach(item => {
            const row = document.createElement('div'); row.className = 'audio-endpoint-row' + (item.default ? ' is-default' : '');
            const stateCode = Number(item.state ?? (item.enabled ? 1 : 2));
            const stateText = stateCode === 1 ? '已启用' : (stateCode === 2 ? '已禁用' : (stateCode === 4 ? '已断开' : (stateCode === 8 ? '未连接' : '不可用')));
            const dot = document.createElement('span'); dot.className = 'audio-endpoint-dot' + (stateCode === 1 ? ' is-enabled' : (stateCode === 2 ? ' is-disabled' : ' is-unavailable'));
            const name = document.createElement('span'); name.className = 'audio-endpoint-name'; name.textContent = item.name + (item.default ? '（当前默认）' : '');
            const state = document.createElement('span'); state.className = 'audio-endpoint-state'; state.textContent = stateText;
            const button = document.createElement('button'); button.type = 'button'; button.className = 'audio-endpoint-toggle';
            button.textContent = stateCode === 1 ? '禁用' : (stateCode === 2 ? '启用' : '不可用');
            button.disabled = (stateCode === 1 && !!item.default) || (stateCode !== 1 && stateCode !== 2);
            button.title = button.disabled && stateCode === 1 ? '默认设备不能直接禁用，请先切换默认设备' : (stateCode > 2 ? '该设备当前已断开或不可用' : '');
            button.addEventListener('click', () => sendMessageToCpp('audio_set_enabled|' + (stateCode === 1 ? '0|' : '1|') + item.id));
            row.append(dot, name, state, button); list.appendChild(row);
        });
    };
    makeList(renderList, render); makeList(captureList, capture);
};

                let groupMatch = false;
                const headText = brandRow.querySelector('.dt-brand-title span')?.textContent.toLowerCase() || "";
                if (headText.includes(lowerQuery)) groupMatch = true;
                let hasVisibleChild = false;
                rows.forEach(row => {

                    if (groupMatch || text.includes(lowerQuery)) {
                        row.style.display = 'grid';

                if (hasVisibleChild || groupMatch) {
                    group.style.display = 'block';
                    brandRow.style.display = 'grid';
                    group.classList.add('expanded');
                } else {
                    group.style.display = 'none';
                }
            });
            // Always renumber after search (both when searching and when clearing)
            if (window._renumberDriverTable) {

            }

    <script>
function parseDownloadSizeBytes(value) {
            if (Number.isFinite(value) && value > 0) return value;
            if (typeof value !== 'string') return 0;
            const match = value.trim().match(/^([0-9]+(?:\.[0-9]+)?)\s*(B|KB|MB|GB|TB)$/i);
            if (!match) return 0;
            const units = { B: 1, KB: 1024, MB: 1024 * 1024, GB: 1024 * 1024 * 1024, TB: 1024 * 1024 * 1024 * 1024 };
            return Number(match[1]) * units[match[2].toUpperCase()];
        }
        function startDownloadBySizePolicy(dl, sourceItem) {
            if (!dl) return;
            const cachedSize = !isMetadataProbeExcludedUrl(dl.url) &&
                jsMetadataCache[dl.name] && Number(jsMetadataCache[dl.name].size);
            const itemSize = sourceItem ? parseDownloadSizeBytes(sourceItem.size) : 0;
            const knownSize = cachedSize > 0 ? cachedSize : itemSize;
            if (!downloads.includes(dl) || dl.status === 'paused' || dl.status === 'completed') return;
            dl._knownSizeBytes = knownSize > 0 ? knownSize : 0;
            enqueueDownload(dl);
        }
        function pruneDownloadQueueState() {
            const liveDownloads = new Map(downloads.map(dl => [dl.id, dl]));
            Array.from(activeDownloadTaskIds).forEach(id => {
                const dl = liveDownloads.get(id);
                if (!dl || !dl._queueManaged || dl.status !== 'downloading') {
                    activeDownloadTaskIds.delete(id);
                }
            });
            liveDownloads.forEach(dl => {
                if (dl._queueManaged && dl.status === 'downloading') {
                    activeDownloadTaskIds.add(dl.id);
                }
            });
            const queuedIds = new Set();
            for (let index = downloadTaskQueue.length - 1; index >= 0; index--) {
                const id = downloadTaskQueue[index];
                const dl = liveDownloads.get(id);
                if (!dl || dl.status !== 'queued' || activeDownloadTaskIds.has(id) || queuedIds.has(id)) {
                    downloadTaskQueue.splice(index, 1);
                } else {
                    queuedIds.add(id);
                }
            }
        }
        function pumpDownloadQueue() {
            pruneDownloadQueueState();
            while (activeDownloadTaskIds.size < DOWNLOAD_TASK_CONCURRENCY && downloadTaskQueue.length > 0) {
                const id = downloadTaskQueue.shift();
                const dl = downloads.find(d => d.id === id);
                if (!dl || dl.status !== 'queued') continue;
                activeDownloadTaskIds.add(id);
                dl.status = 'downloading';
                dl.phase = dl._pendingRouteTarget ? 'switching_route' : 'downloading';
                dl._lastProgressAt = 0;
                if (dl._pendingRouteTarget) {
                    dl._routeSwitchOwnsSlot = true;
                    sendRouteRestartCommand(dl, dl._pendingRouteTarget);
                } else {
                    sendStartDownloadCommand(dl);
                }
            }
            saveHistory();
            updateAllUI();
        }
        function enqueueDownload(dl) {
            if (!dl || downloadTaskQueue.includes(dl.id) || activeDownloadTaskIds.has(dl.id)) return;
            dl.status = 'queued';
            dl.phase = 'queued';
            dl._queueManaged = true;
            downloadTaskQueue.push(dl.id);
            pumpDownloadQueue();
        }
        function releaseDownloadSlot(id) {
            if (!activeDownloadTaskIds.delete(id)) return;
            pumpDownloadQueue();
        }
        function removeDownloadsAndReleaseSlots(predicate) {
            const removedIds = new Set();
            downloads = downloads.filter(dl => {
                if (!predicate(dl)) return true;
                removedIds.add(dl.id);
                return false;
            });
            if (removedIds.size === 0) return false;

            removedIds.forEach(id => activeDownloadTaskIds.delete(id));
            for (let index = downloadTaskQueue.length - 1; index >= 0; index--) {
                if (removedIds.has(downloadTaskQueue[index])) downloadTaskQueue.splice(index, 1);
            }
            pumpDownloadQueue();
            return true;
        }
        function shouldAutoOpenCompletedDownload(dl) {
            if (!dl || dl.suppressAutoOpen || (!dl.forceAutoOpen && !autoOpenExe) || !dl.savePath) return false;
            const lowerPath = dl.savePath.toLowerCase();
            return lowerPath.endsWith('.exe') || lowerPath.endsWith('.vbs');
        }
        function openCompletedDownloadIfEnabled(dl) {
            if (!shouldAutoOpenCompletedDownload(dl)) return false;
            const id = String(dl.id || '');
            const command = id.startsWith('lenovo_dl_')
                ? `open_completed_download|${id}|${dl.savePath}`
                : `open_file|${dl.savePath}`;
            sendMessageToCpp(command);
            return true;
        }
        function resolveDownloadBooleanOption(existingValue, options, optionName) {
            if (options && Object.prototype.hasOwnProperty.call(options, optionName)) {

            return !!existingValue;

        function sendStartDownloadCommand(dl) {
            if (!dl || !dl.id || !dl.name || !dl.savePath || !dl.url) return;

            sendMessageToCpp(prefix + dl.id + '|' + encodeURIComponent(String(dl.name)) + '|' + dl.savePath + '|' + dl.url);
        }
        function sendRouteRestartCommand(dl, route) {
            if (!dl || !route || !dl.id || !dl.name || !dl.savePath || !dl.url) return;
            sendMessageToCpp('restart_download_route|' + route + '|' + dl.id + '|' + encodeURIComponent(String(dl.name)) + '|' + dl.savePath + '|' + dl.url);
        }
        function restoreDownloadAfterRouteSwitchFailure(dl) {
            if (!dl) return;
            const ownsSlot = !!dl._routeSwitchOwnsSlot;
            const previousStatus = dl._prevStatusBeforeSwitch || 'paused';
            dl.status = (previousStatus === 'queued' || previousStatus === 'checking_size') ? 'paused' : previousStatus;
            dl.phase = dl._prevPhaseBeforeSwitch || dl.status;

        function scheduleDownloadRouteRetry(dl, route) {
            if (!dl || dl._pendingRouteSwitch) return;
            dl._prevStatusBeforeSwitch = dl.status;
            dl._prevPhaseBeforeSwitch = dl.phase;
            dl._pendingRouteSwitch = true;
            dl._pendingRouteTarget = route;
            dl.speed = 0;
            dl._speedAnomalyUntil = 0;

            if (dl._queueManaged && !activeDownloadTaskIds.has(dl.id)) {
                if (!downloadTaskQueue.includes(dl.id)) enqueueDownload(dl);
                else {
                    dl.status = 'queued';
                    dl.phase = 'queued';

                }
            } else {
                dl.status = 'downloading';
                dl.phase = 'switching_route';
                saveHistory();
                updateAllUI();
                sendRouteRestartCommand(dl, route);
            }
            showToast(route === 'telecom'
                ? uiText('正在切换电信线路重试', 'Retrying on telecom route')
                : uiText('正在切换移动线路重试', 'Retrying on mobile route'));
        }
        function retryDownloadWithRoute(id, route) {
            const dl = downloads.find(d => d.id === id);
            const normalizedRoute = normalizeDownloadRoute(route);
            if (!dl || !dl.url || !dl.savePath || dl._pendingRouteSwitch || normalizedRoute === 'original') return;
            const routeLabel = normalizedRoute === 'telecom' ? uiText('电信线路', 'telecom route') : uiText('移动线路', 'mobile route');
            showCustomDialog(
                uiText('切换下载线路', 'Switch download route'),
                uiText(
                    `切换到${routeLabel}会清除当前任务的临时分片，并从头重新下载。`,
                    `Switching to the ${routeLabel} clears partial data and restarts this task from the beginning.`
                ),
                () => scheduleDownloadRouteRetry(dl, normalizedRoute)

        function toggleDownloadState(id) {
            const dl = downloads.find(d => d.id === id);
            if (!dl) return;
            if (dl._pendingRouteSwitch || dl.phase === 'switching_route') {
                showToast(uiText('线路切换完成后再操作此任务', 'Wait for the route switch to finish'));
                return;
            }
            if (dl.status === 'queued' || dl.status === 'checking_size') {
                const queueIndex = downloadTaskQueue.indexOf(id);
                if (queueIndex !== -1) downloadTaskQueue.splice(queueIndex, 1);
                dl.status = 'paused';
                dl.phase = 'paused';
                saveHistory();
                updateAllUI();
            } else if (dl.status === 'downloading') {
                if (dl.total > 0 && dl.downloaded >= dl.total) {
                    showToast("文件正在合并中，请稍候...");
                    return;
                }
                dl.status = 'paused';
                dl.speed = 0;
                dl.phase = 'paused';
                saveHistory();
                updateAllUI();
                if (dl.btnEl && document.body.contains(dl.btnEl)) {
                    setDownloadButtonPaused(dl.btnEl);
                }
                sendMessageToCpp('pause_download|' + id);
            } else if (dl.status === 'paused' || dl.status === 'error') {
                dl.status = 'downloading';
                dl._lastDownloadedMB = sanitizeMB(dl.downloaded);
                dl._lastProgressAt = 0;
                dl._speedAnomalyUntil = 0;
                dl.phase = 'downloading';
                if (dl.btnEl && document.body.contains(dl.btnEl)) {
                    setDownloadButtonDownloading(dl.btnEl);
                }
                updateAllUI();
                if (dl._queueManaged) enqueueDownload(dl);
                else sendStartDownloadCommand(dl);
                saveHistory();
            } else if (dl.status === 'completed') {
                // Mark as user-initiated, then ask C++ to check file
                pendingUserChecks.add(dl.id);
                sendMessageToCpp('check_file_exists|' + dl.id + '|' + dl.savePath);
            }
        }
        function simulateDownload(softwareName, btnEl, directUrl = null, subFolder = '', options = {}) {
            if (subFolder && typeof subFolder === 'object') {
                options = subFolder;
                subFolder = '';
            }
            options = options || {};
            sendMessageToCpp('user_click|点击下载/启动按钮|' + softwareName);
            let targetItem = null;
            if (directUrl) {
                targetItem = (options.sourceItem && options.sourceItem.url === directUrl)
                    ? options.sourceItem
                    : { url: directUrl, _fromCloudCache: !!options.fromCache };
            } else {
                for (let cat of database) {
                    if (cat.items) {
                        let found = cat.items.find(i => i.name === softwareName);
                        if (found) { targetItem = found; break; }
                    }
                }
            }
            if (!targetItem || !targetItem.url) {
                showToast("未找到该软件的有效下载链接！");
                return;
            }
            if (blockCachedCloudDownloadIfNeeded(targetItem, {
                name: softwareName,
                btnEl,
                subFolder,
                options
            })) {
                return;
            }
            const saveFileName = buildDownloadFileName(
                softwareName,
                targetItem.url,
                options.suggestedFileName,
                !!options.preferSoftwareNameForFile
            );
            let basePath = defaultDownloadPath;
            if (subFolder) {
                let safeFolder = sanitizeWindowsPathSegment(subFolder, '_');
                basePath = defaultDownloadPath + "\\\\" + safeFolder;
            }
            let saveFile = basePath + "\\\\" + saveFileName;
            // 去重优先按保存路径匹配(与原生一致)，避免同名但不同子目录/不同文件的任务互相误命中；
            // 兼容旧历史记录(可能没有 savePath 字段)时回退到按名称匹配。
            let existingDl = downloads.find(d => d.status !== 'error' && (d.savePath ? isSameWindowsPath(d.savePath, saveFile) : d.name === softwareName));
            if (existingDl && existingDl.status !== 'error') {
                if (options.directDownload) existingDl.directDownload = true;
                if (options.downloadOnly && (existingDl.status === 'downloading' || existingDl.status === 'queued' || existingDl.status === 'checking_size')) {
                    showToast('该软件已在下载中');
                    saveHistory();
                    updateAllUI();
                    return existingDl.id;
                }
                if (options.downloadOnly && existingDl.status === 'completed') {
                    // 不能只信历史记录：文件可能已被移走或删除，先问原生文件还在不在
                    pendingDownloadOnlyChecks.add(existingDl.id);
                    sendMessageToCpp('check_file_exists|' + existingDl.id + '|' + (existingDl.savePath || saveFile));
                    return existingDl.id;
                }
                if (options.batchMode) {
                    if (existingDl.status === 'paused') {
                        existingDl.suppressAutoOpen = resolveDownloadBooleanOption(existingDl.suppressAutoOpen, options, 'suppressAutoOpen');
                        existingDl.nativeNoOpen = resolveDownloadBooleanOption(existingDl.nativeNoOpen, options, 'nativeNoOpen');
                        startDownloadBySizePolicy(existingDl, targetItem);
                        saveHistory();
                        updateAllUI();
                    }
                    return existingDl.id;
                }
                existingDl.suppressAutoOpen = resolveDownloadBooleanOption(existingDl.suppressAutoOpen, options, 'suppressAutoOpen');
                existingDl.nativeNoOpen = resolveDownloadBooleanOption(existingDl.nativeNoOpen, options, 'nativeNoOpen');
                // If it already exists, toggle its state natively
                if (btnEl) {
                    btnEl.dataset.downloadLabel = softwareName;
                    existingDl.btnEl = btnEl;
                }
                toggleDownloadState(existingDl.id);
                return existingDl.id;
            }
            const rawIdPrefix = String(options.idPrefix || 'dl_').replace(/[^a-zA-Z0-9_]/g, '');
            const idPrefix = rawIdPrefix || 'dl_';
            const id = idPrefix + Date.now() + '_' + (downloadIdSeq++);
            if (btnEl) {
                btnEl.dataset.downloadLabel = softwareName;
                setDownloadButtonDownloading(btnEl);
                // Mount Trash if in action row and not present
                if (btnEl.parentElement && btnEl.parentElement.classList.contains('sw-actions') && !btnEl.parentElement.querySelector('.btn-trash')) {
                    let cleanId = id;
                    let cleanPath = saveFile;
                    const trashBtn = document.createElement('button');
                    trashBtn.className = 'dt-icon-btn btn-trash';
                    trashBtn.title = '删除本地文件';
                    trashBtn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;
                    trashBtn.onclick = (e) => {
                        e.stopPropagation();
                        sendMessageToCpp('delete_file|' + cleanPath);
                        removeDownloadsAndReleaseSlots(d => d.id === cleanId);
                        btnEl.title = '下载/运行';
                        btnEl.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
                        trashBtn.remove();
                    };
                    btnEl.parentElement.appendChild(trashBtn);
                }
            }
            let isFirstDownload = false;
            try {
                if (localStorage.getItem('hasDownloadedBefore') !== 'true') {
                    isFirstDownload = true;
                    localStorage.setItem('hasDownloadedBefore', 'true');
                }
            } catch (e) {
                if (!window._hasDownloadedBefore) {
                    isFirstDownload = true;
                    window._hasDownloadedBefore = true;
                }
            }
            const dl = {
                id: id,
                name: softwareName,
                status: 'downloading',
                downloaded: 0,
                total: 0,
                speed: 0,
                btnEl: btnEl,
                savePath: saveFile,
                url: targetItem.url,
                actualRoute: inferDownloadRouteFromUrl(targetItem.url),
                routeMode: /[?&](?:sign|x-amz-signature)=/i.test(targetItem.url || '') ? 'signed_direct' : 'original',
                routeSource: String(options.routeMode || '').trim() === 'lenovo_store'
                    ? 'lenovo_store'
                    : String(options.routeMode || '').trim() === 'official_direct'
                        ? 'official_direct'
                        : 'yu_store',
                isFirstDownload: isFirstDownload,
                suppressAutoOpen: resolveDownloadBooleanOption(false, options, 'suppressAutoOpen'),
                nativeNoOpen: resolveDownloadBooleanOption(false, options, 'nativeNoOpen'),
                forceAutoOpen: !!options.forceAutoOpen
            };
            dl.directDownload = !!options.directDownload;
            downloads.unshift(dl);
            userDismissedWidget = false;
            updateAllUI();
            startDownloadBySizePolicy(dl, targetItem);
            saveHistory();
            return id;
        }
        function startDirectDownload() {
            const urlInput = document.getElementById('directDownloadUrlInput');
            const nameInput = document.getElementById('directDownloadNameInput');
            const button = document.getElementById('directDownloadStartBtn');
            const rawUrl = String(urlInput && urlInput.value || '').trim();
            if (!/^https?:\/\//i.test(rawUrl)) {
                showToast('请输入 http:// 或 https:// 文件直链');
                if (urlInput) urlInput.focus();
                return;
            }
            let parsed;
            try { parsed = new URL(rawUrl); } catch (_) { parsed = null; }
            if (!parsed || !parsed.hostname) {
                showToast('直链格式不正确');
                if (urlInput) urlInput.focus();
                return;
            }
            const manualName = String(nameInput && nameInput.value || '').trim();
            let urlLeaf = '';
            try { urlLeaf = decodeURIComponent(parsed.pathname.split('/').pop() || '').trim(); } catch (_) {}
            const displayName = manualName || urlLeaf || ('直链文件-' + parsed.hostname);
            simulateDownload(displayName, button, rawUrl, '', {
                idPrefix: 'direct_',
                directDownload: true,
                downloadOnly: true,
                nativeNoOpen: true,
                suppressAutoOpen: true,
                suggestedFileName: manualName || urlLeaf || ''
            });
            renderDirectDownloadProgress();
        }
        function renderDirectDownloadProgress() {
            const title = document.getElementById('directDownloadProgressTitle');
            const percent = document.getElementById('directDownloadProgressPercent');
            const bar = document.getElementById('directDownloadProgressBar');
            const meta = document.getElementById('directDownloadProgressMeta');
            const button = document.getElementById('directDownloadStartBtn');
            if (!title || !percent || !bar || !meta) return;
            const task = downloads.find(dl => dl && dl.directDownload);
            if (!task) {
                title.textContent = '暂无直链下载任务';
                percent.textContent = '0%';
                bar.style.width = '0%';
                meta.textContent = '输入链接后点击“开始下载”';
                if (button) button.disabled = false;
                return;
            }
            const info = getDownloadDisplayInfo(task);
            const isActive = task.status === 'downloading' || task.status === 'queued' || task.status === 'checking_size';
            const shownPercent = task.status === 'completed' ? 100 : (task.total > 0 ? info.percent : 0);
            title.textContent = task.name || '直链文件';
            percent.textContent = task.total > 0 || task.status === 'completed' ? `${shownPercent}%` : info.statusText;
            bar.style.width = `${shownPercent}%`;
            meta.textContent = task.status === 'completed'
                ? '下载完成，文件已保存到下载目录'
                : `${info.statusText} · ${info.progressText}`;
            if (button) button.disabled = isActive;
        }
        function updateAllUI() {
            renderFloatingWidget();
            if (database[currentViewIndex] && database[currentViewIndex].type === 'downloads_page') {
                renderDownloadsPage();
            }
            if (typeof renderDirectDownloadProgress === 'function') renderDirectDownloadProgress();
        }
        function saveHistory() {
            const cleanDownloads = downloads.map(dl => ({
                id: dl.id,
                name: dl.name,
                status: dl.status,
                downloaded: dl.downloaded,
                total: dl.total,
                speed: 0,
                savePath: dl.savePath,
                url: dl.url,
                actualRoute: normalizeDownloadRoute(dl.actualRoute || inferDownloadRouteFromUrl(dl.url)),
                routeMode: dl.routeMode || inferDownloadRouteMode(dl),
                routeSource: dl.routeSource || 'yu_store',
                suppressAutoOpen: !!dl.suppressAutoOpen,
                nativeNoOpen: !!dl.nativeNoOpen,
                directDownload: !!dl.directDownload,
                queueManaged: dl._queueManaged !== false
            }));
            sendMessageToCpp('save_history|' + JSON.stringify(cleanDownloads));
        }
        function renderFloatingWidget() {
            const widget = document.getElementById('downloadWidget');
            const active = downloads.filter(d => d.status === 'downloading' || d.status === 'paused' || d.status === 'queued' || d.status === 'checking_size');
            const widgetText = currentLang === 'en'
                ? {
                    title: 'Download Tasks',
                    silent: 'Do not disturb',
                    connecting: 'Connecting...',

                }
                : {
                    title: '下载任务',
                    silent: '免打扰',
                    connecting: '正在准备下载...',
                    waiting: '等待数据获取...',

                };
            if (active.length === 0) {
                userDismissedWidget = false;
                widget.style.opacity = '0';

                widget.style.pointerEvents = 'none';
